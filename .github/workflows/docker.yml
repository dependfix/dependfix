name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      # §T1310: release.yml 完成后主动 workflow_dispatch docker.yml，传 platform_version
      # 触发条件 = 仅 build job（push:master 触发时 inputs.platform_version 为空，跳过
      # platform-x.y.z tag，保持 latest+date+sha 三元组）
      platform_version:
        description: '依赖 platform 包版本号（仅 release.yml 主动触发时填）'
        type: string
        required: false
        default: ''
  push:
    branches:
      - master

# 仅取消针对当前工作流正在进行的作业或运行
concurrency:
  # 发布构建（带 platform_version）单列分组且禁用取消：多架构 QEMU 构建耗时长，被后续 push 取代
  # 会白烧算力；普通 push 之间仍互相取代。
  # 注：0.6.0 的 platform-0.4.0 tag 缺失**不是**并发取消造成的——那次 dispatch 运行的 build job
  # 触及 120 分钟 job 上限被 kill（step 已跑 115.5 分钟；同窗反向取消的是更早的 push run）。
  # 对应修复是下方 build job 的 timeout-minutes 提到 240 分钟。
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform_version || 'push' }}
  cancel-in-progress: ${{ inputs.platform_version == '' }}

jobs:
  # 质量门：lint / typecheck / test 全绿后才允许构建镜像
  qa:
    name: QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # platform 的 lint/typecheck 依赖 .nuxt 类型生成（.nuxt 为 Nuxt 生成产物且已 gitignore，
      # 无 postinstall 钩子，必须显式 prepare 生成；删除此步骤会导致 lint/typecheck 解析失败）
      - run: pnpm --filter @dependfix/platform exec nuxt prepare
      # 平台 server 代码 import dependfix、@dependfix/core、@dependfix/engine 的 dist 类型声明（Nuxt tsconfig 不映射 workspace 源码）：
      # CI 中 pnpm i 不构建 workspace 包，必须先构建 core+engine+cli 否则 lint/typecheck 类型解析失败
      # （顺序与 Dockerfile 的 core → engine → cli → platform 一致）
      - run: pnpm --filter @dependfix/core build && pnpm --filter @dependfix/engine build && pnpm --filter dependfix build
      - run: pnpm run lint:check
      - run: pnpm run lint:css:check
      - run: pnpm run lint:md:check
      - run: pnpm run typecheck
      - run: pnpm run test

  build:
    needs: qa
    runs-on: ubuntu-latest
    # 多架构（amd64 + arm64 QEMU）完整构建实测单 step 已达 115.5 分钟：0.6.0 的发布派发运行
    # 40745976335 因此在 120 分钟上限被 kill，platform-0.4.0 tag 从未产出。提到 240 分钟留余量；
    # 根治方向（原生 arm runner / 拆分 per-arch job）已登记 backlog。
    timeout-minutes: 240
    permissions:
      packages: write
      contents: read
      # Buildx 的 type=gha 缓存需要 actions 写权限（隐含读）
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Get short commit hash
        run: echo "TAG=sha-${GITHUB_SHA::7}" >>${GITHUB_ENV}
      # ── §T1310 platform version 提取 ───────────────────────
      # release.yml 主动触发时（workflow_dispatch inputs.platform_version 非空），
      # 直接把入参当作 platform_version 输出；push:master 触发时入参为空，输出空，
      # 下游 metadata-action tag 的 enable=false → 不打 platform-x.y.z tag。
      - name: Extract platform version
        id: platform-version
        run: |
          if [ -n "${{ inputs.platform_version }}" ]; then
            echo "platform_version=${{ inputs.platform_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "platform_version=" >> "$GITHUB_OUTPUT"
          fi
      # ── 原生多架构构建 ─────────────────────────────────────
      # 直接使用原始 Dockerfile，让 Buildx + QEMU 在各目标平台上
      # 完整执行 pnpm install → build，确保原生模块（better-sqlite3）
      # 针对各架构正确编译，避免预构建 x86_64 产物跨平台兼容问题。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      # 镜像命名：Docker Hub / 阿里云暂用 caomeiyouren/dependfix（dependfix/dependfix 未注册）；
      # GitHub 用 dependfix/dependfix。metadata 按 registry 分组拆成两步，使各推送步骤
      # 直接消费对应 tags，避免在表达式内做 filter/split 过滤（GitHub 表达式解析器不支持
      # `=>` 箭头函数，filter 亦不在官方函数列表，2026-08 实证 422：Unexpected symbol '='）。
      # 注意：两个步骤的 tags 策略需保持同步。
      - name: Extract Docker metadata (Docker Hub & GHCR)
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            caomeiyouren/dependfix
            ghcr.io/dependfix/dependfix
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}},enable=true
            type=sha,format=short,prefix=sha-,enable=true
            type=raw,value=platform-${{ steps.platform-version.outputs.platform_version }},enable=${{ steps.platform-version.outputs.platform_version != '' }}
          flavor: latest=false
      - name: Extract Docker metadata (Alibaba Cloud ACR)
        id: metadata-acr
        uses: docker/metadata-action@v6
        with:
          images: |
            registry.cn-hangzhou.aliyuncs.com/caomeiyouren/dependfix
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}},enable=true
            type=sha,format=short,prefix=sha-,enable=true
            type=raw,value=platform-${{ steps.platform-version.outputs.platform_version }},enable=${{ steps.platform-version.outputs.platform_version != '' }}
          flavor: latest=false
      # ── 镜像可用性冒烟（推送前门禁）─────────────────────────────
      # 先构建单架构（amd64）本地镜像并加载到 runner，跑 apps/platform/docker/smoke-test.sh：
      # 验证「不依赖部署侧 compose 注入 env」时首次启动自动建表（HTTP 200 + 13 业务表 + 无 no such table）。
      # 冒烟失败则后续 push 步骤不执行（同 job 顺序），避免发布不可用镜像。
      # 基础镜像从 Docker Hub 拉取（Dockerfile FROM 的字面引用）：本 job 的 `Login to Docker Hub`
      # 必须保持在三个构建步骤之前——移除或前移该步骤会让拉取退回匿名通道（100 次/6h 按出口 IP，
      # 共享 runner 上易 429）。口径详见 Dockerfile 顶部注释。
      - name: Build local image for smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          push: false
          load: true
          tags: dependfix-smoke:ci
          platforms: linux/amd64
          # 固定哨兵 build-arg：让冒烟能端到端校验「ARG → ENV → runtimeConfig → /api/health」注入链路
          build-args: |
            BUILD_COMMIT=smoke-commit
            BUILD_VERSION=smoke-version
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test built image
        env:
          SMOKE_EXPECT_VERSION: smoke-version
          SMOKE_EXPECT_COMMIT: smoke-commit
        run: SMOKE_IMAGE=dependfix-smoke:ci sh apps/platform/docker/smoke-test.sh
      # 镜像分两批推送：Docker Hub / GHCR 保留 provenance attestation（build-push-action@v7
      # 默认 --attest type=provenance,mode=max）；阿里云 ACR 个人版不支持 OCI attestation
      # artifact（推送 application/vnd.oci.empty.v1+json 被拒：unknown manifest class），
      # 必须关闭 attestation 单独推送。两次构建共用同一 Buildx 实例与 gha 层缓存，成本可忽略。
      - name: Build and push Docker images (Docker Hub & GHCR)
        uses: docker/build-push-action@v7
        with:
          # 使用原始 Dockerfile，Buildx + QEMU 为各平台原生编译
          context: .
          file: apps/platform/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.platform-version.outputs.platform_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Docker images (Alibaba Cloud ACR)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          push: true
          tags: ${{ steps.metadata-acr.outputs.tags }}
          labels: ${{ steps.metadata-acr.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.platform-version.outputs.platform_version }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker Hub README & description sync
        uses: meeDamian/sync-readme@v1.0.6
        with:
          user: ${{ secrets.DOCKER_USERNAME }}
          pass: ${{ secrets.DOCKER_PASSWORD }}
          slug: caomeiyouren/dependfix
          description: "dependfix 平台 - 自动化处理 Dependabot / Code Scanning 安全告警"
      - name: Deploy to Jenkins
        if: ${{ github.repository == 'dependfix/dependfix' }}
        run: curl -X GET -L --user ${{ secrets.JENKINS_TOKEN }} "${{ secrets.JENKINS_URL }}/job/dependfix/buildWithParameters?token=${{ secrets.JENKINS_JOB_TOKEN }}&DOCKER_IMAGE=caomeiyouren/dependfix:${{ env.TAG }}"