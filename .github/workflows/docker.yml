name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      # §T1310: release.yml 完成后主动 workflow_dispatch docker.yml，传 platform_version
      # 触发条件 = 仅 merge job 的 platform-x.y.z tag（push:master 触发时 inputs.platform_version
      # 为空，跳过该 tag，保持 latest+date+sha 三元组）
      platform_version:
        description: '依赖 platform 包版本号（仅 release.yml 主动触发时填）'
        type: string
        required: false
        default: ''
  push:
    branches:
      - master
    # 仅镜像内容相关路径才触发 push 构建：文档 / 计划 / 脚本改动不产生镜像差异，
    # 触发构建只会白烧算力并与 release 派发争用（1.0.0 实测两路 QEMU 构建各触 240 分钟上限）。
    # 注意：不含 .github/workflows/docker.yml —— 工作流本身的改动不改变镜像内容，
    # 纳入过滤会为一次 workflow 提交白跑一轮构建；需要立即验证工作流时用 workflow_dispatch。
    paths:
      - 'apps/platform/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      # 以下三项分别是 Dockerfile 的 COPY 输入、workspace tsconfig 链的根、构建上下文过滤规则：
      # 改动会改变镜像内容，必须纳入触发面
      - '.npmrc'
      - 'tsconfig.json'
      - '.dockerignore'

# 发布派发（带 platform_version）与普通 push 分属不同分组：
# - 发布构建禁取消（多架构构建耗时长，被后续 push 取代会白烧算力）；
# - 普通 push 之间互相取代（后一次 push 的镜像覆盖前一次）。
# 原生 arm runner 实测（2026-11-07）：冷缓存 amd64 9m37s / arm64 3m43s，热缓存 amd64 2m21s / arm64 1m10s；
# 单架构预算 90 分钟按「冷缓存 + runner 争用」留余量（实测最慢 41m32s）。同一提交上「push 构建 + release 派发」仍会各跑一次，
# 但已不再互相拖慢到超时。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform_version && 'release' || 'push' }}
  cancel-in-progress: ${{ inputs.platform_version == '' }}

jobs:
  # 质量门：lint / typecheck / test 全绿后才允许构建镜像
  qa:
    name: QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # platform 的 lint/typecheck 依赖 .nuxt 类型生成（.nuxt 为 Nuxt 生成产物且已 gitignore，
      # 无 postinstall 钩子，必须显式 prepare 生成；删除此步骤会导致 lint/typecheck 解析失败）
      - run: pnpm --filter @dependfix/platform exec nuxt prepare
      # 平台 server 代码 import dependfix、@dependfix/core、@dependfix/engine 的 dist 类型声明（Nuxt tsconfig 不映射 workspace 源码）：
      # CI 中 pnpm i 不构建 workspace 包，必须先构建 core+engine+cli 否则 lint/typecheck 类型解析失败
      # （顺序与 Dockerfile 的 core → engine → cli → platform 一致）
      - run: pnpm --filter @dependfix/core build && pnpm --filter @dependfix/engine build && pnpm --filter dependfix build
      - run: pnpm run lint:check
      - run: pnpm run lint:css:check
      - run: pnpm run lint:md:check
      - run: pnpm run typecheck
      - run: pnpm run test

  # 原生多架构构建：amd64 / arm64 分别在对应架构的 runner 上构建，避免 QEMU 模拟下从源码
  # 编译 better-sqlite3 与打包 Nuxt client（1.0.0 实测 QEMU 下「Bundling client」单步 3h51m 未完成，
  # 两路构建均触 240 分钟上限被取消）。各架构按 digest 推送，由 merge job 合成多架构 manifest。
  build:
    name: Build (${{ matrix.arch }})
    needs: qa
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # 单架构实测波动大（热缓存 1-3 分钟，冷缓存 9m37s，最慢 41m32s）：60 分钟对冷缓存 + 争用偏紧
    timeout-minutes: 90
    permissions:
      packages: write
      contents: read
      # Buildx 的 type=gha 缓存需要 actions 写权限（隐含读）
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # ── §T1310 platform version 提取 ───────────────────────
      # release.yml 主动触发时（workflow_dispatch inputs.platform_version 非空），
      # 直接把入参当作 platform_version 输出；push:master 触发时入参为空，输出空，
      # merge job 的 metadata tag 相应 enable=false → 不打 platform-x.y.z tag。
      - name: Extract platform version
        id: platform-version
        run: |
          if [ -n "${{ inputs.platform_version }}" ]; then
            echo "platform_version=${{ inputs.platform_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "platform_version=" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      # 镜像配置里的 OCI 标签（source / revision / version / created）由构建阶段写入，
      # 不能靠 manifest 合成阶段补（`imagetools create` 不支持 annotation，实测报
      # `annotations are not supported yet`）。images 仅用于生成 labels，忽略其 tags。
      - name: Extract Docker metadata (labels)
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: caomeiyouren/dependfix
          # 显式给 tag，使 org.opencontainers.image.version 等于发布版本（缺省会取 ref 名 = master）；
          # 该 tag 仅用于生成 labels，不参与推送（推送发生在 merge job）。
          tags: |
            type=raw,value=${{ steps.platform-version.outputs.platform_version || github.sha }}
      # 沙箱镜像的 OCI 标签（独立镜像名，仅用于构建期 labels；tags 同样不参与推送）
      - name: Extract Docker metadata (sandbox labels)
        id: metadata-sandbox
        uses: docker/metadata-action@v6
        with:
          images: caomeiyouren/dependfix-sandbox
          tags: |
            type=raw,value=${{ steps.platform-version.outputs.platform_version || github.sha }}

      - name: Extract Docker metadata (sandbox-full labels)
        id: metadata-sandbox-full
        uses: docker/metadata-action@v6
        with:
          images: caomeiyouren/dependfix-sandbox-full
          tags: |
            type=raw,value=${{ steps.platform-version.outputs.platform_version || github.sha }}

      # ── 镜像可用性冒烟（推送前门禁，仅 amd64）─────────────────────
      # 先构建单架构本地镜像并加载到 runner，跑 apps/platform/docker/smoke-test.sh：
      # 验证「不依赖部署侧 compose 注入 env」时首次启动自动建表（HTTP 200 + 13 业务表 + 无 no such table）。
      # 冒烟失败则后续按 digest 推送不执行（同 job 顺序），避免发布不可用镜像。
      # 基础镜像从 Docker Hub 拉取（Dockerfile FROM 的字面引用）：上面的 `Login to Docker Hub`
      # 必须保持在构建步骤之前——移除或前移该步骤会让拉取退回匿名通道（100 次/6h 按出口 IP，
      # 共享 runner 上易 429）。口径详见 Dockerfile 顶部注释。
      - name: Build local image for smoke test (amd64)
        if: ${{ matrix.arch == 'amd64' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          push: false
          load: true
          tags: dependfix-smoke:ci
          platforms: linux/amd64
          # 固定哨兵 build-arg：让冒烟能端到端校验「ARG → ENV → runtimeConfig → /api/health」注入链路
          build-args: |
            BUILD_COMMIT=smoke-commit
            BUILD_VERSION=smoke-version
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test built image
        if: ${{ matrix.arch == 'amd64' }}
        env:
          SMOKE_EXPECT_VERSION: smoke-version
          SMOKE_EXPECT_COMMIT: smoke-commit
        run: SMOKE_IMAGE=dependfix-smoke:ci sh apps/platform/docker/smoke-test.sh
      # 沙箱镜像冒烟：只构建 sandbox target（不触发 Nuxt），以运行时同参数验证自包含入口
      - name: Build sandbox image for smoke test (amd64)
        if: ${{ matrix.arch == 'amd64' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          target: sandbox
          push: false
          load: true
          tags: dependfix-sandbox-smoke:ci
          platforms: linux/amd64
          build-args: |
            BUILD_COMMIT=smoke-commit
            BUILD_VERSION=smoke-version
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Smoke test sandbox image
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          set -euo pipefail
          docker run --rm --user 100:100 dependfix-sandbox-smoke:ci node /app/sandbox/bin.mjs --version
          docker run --rm --user 100:100 -e DEPENDFIX_SKILLS_DIR=/app/sandbox/skills \
            dependfix-sandbox-smoke:ci node /app/sandbox/bin.mjs skills doctor
          # slim 不应含编译工具链：逐项反向断言（多参数 command -v 只在全缺时非零）
          for tool in python3 make g++; do
            if docker run --rm --user 100:100 --entrypoint sh dependfix-sandbox-smoke:ci \
              -c "command -v ${tool} >/dev/null 2>&1"; then
              echo "::error::slim 沙箱镜像包含 ${tool}（应使用 slim 工具链基底）"; exit 1
            fi
          done

      - name: Build sandbox-full image for smoke test (amd64)
        if: ${{ matrix.arch == 'amd64' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          target: sandbox-full
          push: false
          load: true
          tags: dependfix-sandbox-full-smoke:ci
          platforms: linux/amd64
          build-args: |
            BUILD_COMMIT=smoke-commit
            BUILD_VERSION=smoke-version
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Smoke test sandbox-full image
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          set -euo pipefail
          docker run --rm --user 100:100 dependfix-sandbox-full-smoke:ci node /app/sandbox/bin.mjs --version
          for tool in python3 make g++; do
            docker run --rm --user 100:100 --entrypoint sh dependfix-sandbox-full-smoke:ci -c "command -v ${tool} >/dev/null"
          done

      # ── 按 digest 推送（每个 registry 一次，共用层缓存）─────────────────
      # 三个 registry 的镜像名不同（Docker Hub / ACR 为 caomeiyouren/dependfix，GHCR 为
      # dependfix/dependfix），digest 各自独立，故每个 registry 各推一次并在 merge job
      # 用各自的 digest 组装 manifest list。
      # provenance 统一关闭：ACR 个人版拒绝 OCI attestation artifact
      # （application/vnd.oci.empty.v1+json → unknown manifest class），
      # 且 `imagetools create` 不支持跨 registry 传递 attestation，三处口径保持一致。
      - name: Build and push by digest (Docker Hub)
        id: build-dockerhub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=caomeiyouren/dependfix,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.platform-version.outputs.platform_version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Build and push by digest (GHCR)
        id: build-ghcr
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/dependfix/dependfix,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.platform-version.outputs.platform_version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Build and push by digest (Alibaba Cloud ACR)
        id: build-acr
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=registry.cn-hangzhou.aliyuncs.com/caomeiyouren/dependfix,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.platform-version.outputs.platform_version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Build and push sandbox by digest (Docker Hub)
        id: build-sandbox-dockerhub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          target: sandbox
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=caomeiyouren/dependfix-sandbox,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata-sandbox.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.platform-version.outputs.platform_version }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}
            type=gha,scope=${{ matrix.arch }}-sandbox
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-sandbox
      - name: Build and push sandbox by digest (GHCR)
        id: build-sandbox-ghcr
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          target: sandbox
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/dependfix/dependfix-sandbox,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata-sandbox.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.platform-version.outputs.platform_version }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}
            type=gha,scope=${{ matrix.arch }}-sandbox
      - name: Build and push sandbox by digest (Alibaba Cloud ACR)
        id: build-sandbox-acr
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          target: sandbox
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=registry.cn-hangzhou.aliyuncs.com/caomeiyouren/dependfix-sandbox,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata-sandbox.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.platform-version.outputs.platform_version }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}
            type=gha,scope=${{ matrix.arch }}-sandbox
      - name: Build and push sandbox-full by digest (Docker Hub)
        id: build-sandbox-full-dockerhub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          target: sandbox-full
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=caomeiyouren/dependfix-sandbox-full,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata-sandbox-full.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.platform-version.outputs.platform_version }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}
            type=gha,scope=${{ matrix.arch }}-sandbox-full
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-sandbox-full
      - name: Build and push sandbox-full by digest (GHCR)
        id: build-sandbox-full-ghcr
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          target: sandbox-full
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/dependfix/dependfix-sandbox-full,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata-sandbox-full.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.platform-version.outputs.platform_version }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}
            type=gha,scope=${{ matrix.arch }}-sandbox-full
      - name: Build and push sandbox-full by digest (Alibaba Cloud ACR)
        id: build-sandbox-full-acr
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          target: sandbox-full
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=registry.cn-hangzhou.aliyuncs.com/caomeiyouren/dependfix-sandbox-full,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata-sandbox-full.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_VERSION=${{ steps.platform-version.outputs.platform_version }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}
            type=gha,scope=${{ matrix.arch }}-sandbox-full
      - name: Export digests
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s' "${{ steps.build-dockerhub.outputs.digest }}" > "${RUNNER_TEMP}/digests/dockerhub-${{ matrix.arch }}.digest"
          printf '%s' "${{ steps.build-ghcr.outputs.digest }}" > "${RUNNER_TEMP}/digests/ghcr-${{ matrix.arch }}.digest"
          printf '%s' "${{ steps.build-acr.outputs.digest }}" > "${RUNNER_TEMP}/digests/acr-${{ matrix.arch }}.digest"
          printf '%s' "${{ steps.build-sandbox-dockerhub.outputs.digest }}" > "${RUNNER_TEMP}/digests/sandbox-dockerhub-${{ matrix.arch }}.digest"
          printf '%s' "${{ steps.build-sandbox-ghcr.outputs.digest }}" > "${RUNNER_TEMP}/digests/sandbox-ghcr-${{ matrix.arch }}.digest"
          printf '%s' "${{ steps.build-sandbox-acr.outputs.digest }}" > "${RUNNER_TEMP}/digests/sandbox-acr-${{ matrix.arch }}.digest"
          printf '%s' "${{ steps.build-sandbox-full-dockerhub.outputs.digest }}" > "${RUNNER_TEMP}/digests/sandbox-full-dockerhub-${{ matrix.arch }}.digest"
          printf '%s' "${{ steps.build-sandbox-full-ghcr.outputs.digest }}" > "${RUNNER_TEMP}/digests/sandbox-full-ghcr-${{ matrix.arch }}.digest"
          printf '%s' "${{ steps.build-sandbox-full-acr.outputs.digest }}" > "${RUNNER_TEMP}/digests/sandbox-full-acr-${{ matrix.arch }}.digest"
          # 空 digest 会让 merge 阶段拼出 `image@` 的晦涩报错，这里提前失败
          for f in "${RUNNER_TEMP}"/digests/*.digest; do
            [ -s "$f" ] || { echo "::error::digest 为空：${f}"; exit 1; }
          done
          ls -l "${RUNNER_TEMP}/digests"
      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # 合成多架构 manifest 并打 tag：只做 registry manifest 操作，不重复构建。
  merge:
    name: Publish multi-arch manifests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
    steps:
      # 需要工作区的 README.md 做 Docker Hub 描述同步（sync-readme 读本地文件）
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Get short commit hash
        run: echo "TAG=sha-${GITHUB_SHA::7}" >>${GITHUB_ENV}
      # 三个 registry 分别生成 tag 列表（镜像名不同）。tags 策略需与下方 manifest 组装保持同步。
      - name: Extract Docker metadata (Docker Hub)
        id: metadata-dockerhub
        uses: docker/metadata-action@v6
        with:
          images: caomeiyouren/dependfix
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}},enable=true
            type=sha,format=short,prefix=sha-,enable=true
            type=raw,value=platform-${{ inputs.platform_version }},enable=${{ inputs.platform_version != '' }}
          flavor: latest=false
      - name: Extract Docker metadata (GHCR)
        id: metadata-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dependfix/dependfix
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}},enable=true
            type=sha,format=short,prefix=sha-,enable=true
