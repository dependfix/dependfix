name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      # §T1310: release.yml 完成后主动 workflow_dispatch docker.yml，传 platform_version
      # 触发条件 = 仅 build job（push:master 触发时 inputs.platform_version 为空，跳过
      # platform-x.y.z tag，保持 latest+date+sha 三元组）
      platform_version:
        description: '依赖 platform 包版本号（仅 release.yml 主动触发时填）'
        type: string
        required: false
        default: ''
  push:
    branches:
      - master

# 仅取消针对当前工作流正在进行的作业或运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 质量门：lint / typecheck / test 全绿后才允许构建镜像
  qa:
    name: QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # platform 的 lint/typecheck 依赖 .nuxt 类型生成（.nuxt 为 Nuxt 生成产物且已 gitignore，
      # 无 postinstall 钩子，必须显式 prepare 生成；删除此步骤会导致 lint/typecheck 解析失败）
      - run: pnpm --filter @dependfix/platform exec nuxt prepare
      # 平台 server 代码 import dependfix、@dependfix/core、@dependfix/engine 的 dist 类型声明（Nuxt tsconfig 不映射 workspace 源码）：
      # CI 中 pnpm i 不构建 workspace 包，必须先构建 core+engine+cli 否则 lint/typecheck 类型解析失败
      # （顺序与 Dockerfile 的 core → engine → cli → platform 一致）
      - run: pnpm --filter @dependfix/core build && pnpm --filter @dependfix/engine build && pnpm --filter dependfix build
      - run: pnpm run lint
      - run: pnpm run lint:md:check
      - run: pnpm run typecheck
      - run: pnpm run test

  build:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      packages: write
      contents: read
      # Buildx 的 type=gha 缓存需要 actions 写权限（隐含读）
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # ── §T1310 platform version 提取 ───────────────────────
      # release.yml 主动触发时（workflow_dispatch inputs.platform_version 非空），
      # 直接把入参当作 platform_version 输出；push:master 触发时入参为空，输出空，
      # 下游 metadata-action tag 的 enable=false → 不打 platform-x.y.z tag。
      - name: Extract platform version
        id: platform-version
        run: |
          if [ -n "${{ inputs.platform_version }}" ]; then
            echo "platform_version=${{ inputs.platform_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "platform_version=" >> "$GITHUB_OUTPUT"
          fi
      # ── 原生多架构构建 ─────────────────────────────────────
      # 直接使用原始 Dockerfile，让 Buildx + QEMU 在各目标平台上
      # 完整执行 pnpm install → build，确保原生模块（better-sqlite3）
      # 针对各架构正确编译，避免预构建 x86_64 产物跨平台兼容问题。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      # 镜像命名：Docker Hub / 阿里云暂用 caomeiyouren/dependfix（dependfix/dependfix 未注册）；
      # GitHub 用 dependfix/dependfix。metadata 按 registry 分组拆成两步，使各推送步骤
      # 直接消费对应 tags，避免在表达式内做 filter/split 过滤（GitHub 表达式解析器不支持
      # `=>` 箭头函数，filter 亦不在官方函数列表，2026-08 实证 422：Unexpected symbol '='）。
      # 注意：两个步骤的 tags 策略需保持同步。
      - name: Extract Docker metadata (Docker Hub & GHCR)
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            caomeiyouren/dependfix
            ghcr.io/dependfix/dependfix
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}},enable=true
            type=sha,format=short,prefix=sha-,enable=true
            type=raw,value=platform-${{ steps.platform-version.outputs.platform_version }},enable=${{ steps.platform-version.outputs.platform_version != '' }}
          flavor: latest=false
      - name: Extract Docker metadata (Alibaba Cloud ACR)
        id: metadata-acr
        uses: docker/metadata-action@v6
        with:
          images: |
            registry.cn-hangzhou.aliyuncs.com/caomeiyouren/dependfix
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}},enable=true
            type=sha,format=short,prefix=sha-,enable=true
            type=raw,value=platform-${{ steps.platform-version.outputs.platform_version }},enable=${{ steps.platform-version.outputs.platform_version != '' }}
          flavor: latest=false
      # 镜像分两批推送：Docker Hub / GHCR 保留 provenance attestation（build-push-action@v7
      # 默认 --attest type=provenance,mode=max）；阿里云 ACR 个人版不支持 OCI attestation
      # artifact（推送 application/vnd.oci.empty.v1+json 被拒：unknown manifest class），
      # 必须关闭 attestation 单独推送。两次构建共用同一 Buildx 实例与 gha 层缓存，成本可忽略。
      - name: Build and push Docker images (Docker Hub & GHCR)
        uses: docker/build-push-action@v7
        with:
          # 使用原始 Dockerfile，Buildx + QEMU 为各平台原生编译
          context: .
          file: apps/platform/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Docker images (Alibaba Cloud ACR)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          push: true
          tags: ${{ steps.metadata-acr.outputs.tags }}
          labels: ${{ steps.metadata-acr.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker Hub README & description sync
        uses: meeDamian/sync-readme@v1.0.6
        with:
          user: ${{ secrets.DOCKER_USERNAME }}
          pass: ${{ secrets.DOCKER_PASSWORD }}
          slug: caomeiyouren/dependfix
          description: "dependfix 平台 - 自动化处理 Dependabot / Code Scanning 安全告警"
