            type=sha,format=short,prefix=sha-,enable=true
            type=raw,value=platform-${{ inputs.platform_version }},enable=${{ inputs.platform_version != '' }}
            type=raw,value=${{ inputs.platform_version }},enable=${{ inputs.platform_version != '' }}
          flavor: latest=false
      - name: Extract Docker metadata (sandbox-full GHCR)
        id: metadata-sandbox-full-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dependfix/dependfix-sandbox-full
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}},enable=true
            type=sha,format=short,prefix=sha-,enable=true
            type=raw,value=platform-${{ inputs.platform_version }},enable=${{ inputs.platform_version != '' }}
            type=raw,value=${{ inputs.platform_version }},enable=${{ inputs.platform_version != '' }}
          flavor: latest=false
      - name: Extract Docker metadata (sandbox-full Alibaba Cloud ACR)
        id: metadata-sandbox-full-acr
        uses: docker/metadata-action@v6
        with:
          images: registry.cn-hangzhou.aliyuncs.com/caomeiyouren/dependfix-sandbox-full
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}},enable=true
            type=sha,format=short,prefix=sha-,enable=true
            type=raw,value=platform-${{ inputs.platform_version }},enable=${{ inputs.platform_version != '' }}
            type=raw,value=${{ inputs.platform_version }},enable=${{ inputs.platform_version != '' }}
          flavor: latest=false
      - name: Create and push multi-arch manifests (Docker Hub)
        env:
          IMAGE: caomeiyouren/dependfix
          TAGS: ${{ steps.metadata-dockerhub.outputs.tags }}
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/digests"
          sources="${IMAGE}@$(cat "${digest_dir}/dockerhub-amd64.digest") ${IMAGE}@$(cat "${digest_dir}/dockerhub-arm64.digest")"
          echo "sources: ${sources}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "::group::docker buildx imagetools create -t ${tag}"
            docker buildx imagetools create -t "${tag}" ${sources}
            echo "::endgroup::"
          done <<< "${TAGS}"
      - name: Create and push multi-arch manifests (GHCR)
        env:
          IMAGE: ghcr.io/dependfix/dependfix
          TAGS: ${{ steps.metadata-ghcr.outputs.tags }}
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/digests"
          sources="${IMAGE}@$(cat "${digest_dir}/ghcr-amd64.digest") ${IMAGE}@$(cat "${digest_dir}/ghcr-arm64.digest")"
          echo "sources: ${sources}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "::group::docker buildx imagetools create -t ${tag}"
            docker buildx imagetools create -t "${tag}" ${sources}
            echo "::endgroup::"
          done <<< "${TAGS}"
      - name: Create and push multi-arch manifests (Alibaba Cloud ACR)
        env:
          IMAGE: registry.cn-hangzhou.aliyuncs.com/caomeiyouren/dependfix
          TAGS: ${{ steps.metadata-acr.outputs.tags }}
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/digests"
          sources="${IMAGE}@$(cat "${digest_dir}/acr-amd64.digest") ${IMAGE}@$(cat "${digest_dir}/acr-arm64.digest")"
          echo "sources: ${sources}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "::group::docker buildx imagetools create -t ${tag}"
            docker buildx imagetools create -t "${tag}" ${sources}
            echo "::endgroup::"
          done <<< "${TAGS}"
      - name: Create and push multi-arch manifests (sandbox Docker Hub)
        env:
          IMAGE: caomeiyouren/dependfix-sandbox
          TAGS: ${{ steps.metadata-sandbox-dockerhub.outputs.tags }}
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/digests"
          sources="${IMAGE}@$(cat "${digest_dir}/sandbox-dockerhub-amd64.digest") ${IMAGE}@$(cat "${digest_dir}/sandbox-dockerhub-arm64.digest")"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "${tag}" ${sources}
          done <<< "${TAGS}"
      - name: Create and push multi-arch manifests (sandbox GHCR)
        env:
          IMAGE: ghcr.io/dependfix/dependfix-sandbox
          TAGS: ${{ steps.metadata-sandbox-ghcr.outputs.tags }}
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/digests"
          sources="${IMAGE}@$(cat "${digest_dir}/sandbox-ghcr-amd64.digest") ${IMAGE}@$(cat "${digest_dir}/sandbox-ghcr-arm64.digest")"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "${tag}" ${sources}
          done <<< "${TAGS}"
      - name: Create and push multi-arch manifests (sandbox Alibaba Cloud ACR)
        env:
          IMAGE: registry.cn-hangzhou.aliyuncs.com/caomeiyouren/dependfix-sandbox
          TAGS: ${{ steps.metadata-sandbox-acr.outputs.tags }}
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/digests"
          sources="${IMAGE}@$(cat "${digest_dir}/sandbox-acr-amd64.digest") ${IMAGE}@$(cat "${digest_dir}/sandbox-acr-arm64.digest")"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "${tag}" ${sources}
          done <<< "${TAGS}"
      - name: Create and push multi-arch manifests (sandbox-full Docker Hub)
        env:
          IMAGE: caomeiyouren/dependfix-sandbox-full
          TAGS: ${{ steps.metadata-sandbox-full-dockerhub.outputs.tags }}
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/digests"
          sources="${IMAGE}@$(cat "${digest_dir}/sandbox-full-dockerhub-amd64.digest") ${IMAGE}@$(cat "${digest_dir}/sandbox-full-dockerhub-arm64.digest")"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "${tag}" ${sources}
          done <<< "${TAGS}"
      - name: Create and push multi-arch manifests (sandbox-full GHCR)
        env:
          IMAGE: ghcr.io/dependfix/dependfix-sandbox-full
          TAGS: ${{ steps.metadata-sandbox-full-ghcr.outputs.tags }}
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/digests"
          sources="${IMAGE}@$(cat "${digest_dir}/sandbox-full-ghcr-amd64.digest") ${IMAGE}@$(cat "${digest_dir}/sandbox-full-ghcr-arm64.digest")"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "${tag}" ${sources}
          done <<< "${TAGS}"
      - name: Create and push multi-arch manifests (sandbox-full Alibaba Cloud ACR)
        env:
          IMAGE: registry.cn-hangzhou.aliyuncs.com/caomeiyouren/dependfix-sandbox-full
          TAGS: ${{ steps.metadata-sandbox-full-acr.outputs.tags }}
        run: |
          set -euo pipefail
          digest_dir="${RUNNER_TEMP}/digests"
          sources="${IMAGE}@$(cat "${digest_dir}/sandbox-full-acr-amd64.digest") ${IMAGE}@$(cat "${digest_dir}/sandbox-full-acr-arm64.digest")"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "${tag}" ${sources}
          done <<< "${TAGS}"
      # 双架构门禁：manifest 由 digest 合成后回读 index，确认 amd64 + arm64 都在
      # （0.4.0 曾出现 tag 从未产出、1.0.0 首轮 QEMU 构建被取消，均属「以为发了其实没有」；
      # 这里用 registry 回读做终态断言，失败即红，不留静默单架构 tag）。
      - name: Verify multi-arch manifests
        env:
          TAGS_DOCKERHUB: ${{ steps.metadata-dockerhub.outputs.tags }}
          TAGS_GHCR: ${{ steps.metadata-ghcr.outputs.tags }}
          TAGS_ACR: ${{ steps.metadata-acr.outputs.tags }}
          TAGS_SANDBOX_DOCKERHUB: ${{ steps.metadata-sandbox-dockerhub.outputs.tags }}
          TAGS_SANDBOX_GHCR: ${{ steps.metadata-sandbox-ghcr.outputs.tags }}
          TAGS_SANDBOX_ACR: ${{ steps.metadata-sandbox-acr.outputs.tags }}
          TAGS_SANDBOX_FULL_DOCKERHUB: ${{ steps.metadata-sandbox-full-dockerhub.outputs.tags }}
          TAGS_SANDBOX_FULL_GHCR: ${{ steps.metadata-sandbox-full-ghcr.outputs.tags }}
          TAGS_SANDBOX_FULL_ACR: ${{ steps.metadata-sandbox-full-acr.outputs.tags }}
        run: |
          set -euo pipefail
          verify() {
            tag="$1"
            [ -z "$tag" ] && return 0
            plats=$(docker buildx imagetools inspect "${tag}" --raw \
              | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort -u | tr '\n' ' ')
            echo "inspect ${tag} → ${plats}"
            case "${plats}" in
              *"linux/amd64"*"linux/arm64"*|*"linux/arm64"*"linux/amd64"*) ;;
              *) echo "::error::${tag} 不是双架构（${plats}）"; exit 1 ;;
            esac
          }
          for t in ${TAGS_DOCKERHUB} ${TAGS_GHCR} ${TAGS_ACR} \
            ${TAGS_SANDBOX_DOCKERHUB} ${TAGS_SANDBOX_GHCR} ${TAGS_SANDBOX_ACR} \
            ${TAGS_SANDBOX_FULL_DOCKERHUB} ${TAGS_SANDBOX_FULL_GHCR} ${TAGS_SANDBOX_FULL_ACR}; do verify "$t"; done

      - name: Docker Hub README & description sync
        uses: meeDamian/sync-readme@v1.0.6
        with:
          user: ${{ secrets.DOCKER_USERNAME }}
          pass: ${{ secrets.DOCKER_PASSWORD }}
          slug: caomeiyouren/dependfix
          description: "dependfix 平台 - 自动化处理 Dependabot / Code Scanning 安全告警"
      - name: Deploy to Jenkins
        if: ${{ github.repository == 'dependfix/dependfix' }}
        run: curl -X GET -L --user ${{ secrets.JENKINS_TOKEN }} "${{ secrets.JENKINS_URL }}/job/dependfix/buildWithParameters?token=${{ secrets.JENKINS_JOB_TOKEN }}&DOCKER_IMAGE=caomeiyouren/dependfix:${{ env.TAG }}"

  # ===============================================================
  #  发布后镜像运行时冒烟（原生双架构）
  #  - 触发面：仅「带 platform_version 的发布派发 / 手工 dispatch」，push:master 的
  #    latest 构建不跑；放在镜像产物所在工作流（docker.yml）的 merge 之后，避免 release.yml
  #    派发后长时间轮询等待镜像。
  #  - 各架构用**原生 runner**（amd64 ubuntu-latest / arm64 ubuntu-24.04-arm），不用 QEMU。
  #  - job 级 continue-on-error：冒烟失败只写 Job Summary + 告警，不改变镜像发布与工作流结论；
  #    失败一律记「未证实」，不得当作通过。
  #  - amd64 腿额外跑历史 tag 巡检（近 10 个发布 tag 的双架构 manifest 判定，fail-open）。
  # ===============================================================
  post-release-smoke:
    name: Post-release smoke (${{ matrix.arch }})
    needs: merge
    if: inputs.platform_version != ''
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      # 历史 tag 巡检依赖本地 tag 列表：默认浅克隆不含 tag，必须显式拉全
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # smoke-test.sh 只检查本地镜像，不负责拉取（build job 复用同一脚本时镜像已在本地）
      - name: Pull image
        env:
          SMOKE_IMAGE: ghcr.io/${{ github.repository }}:platform-${{ inputs.platform_version }}
        run: docker pull "$SMOKE_IMAGE"
      - name: Run image smoke test
        id: smoke
        env:
          SMOKE_IMAGE: ghcr.io/${{ github.repository }}:platform-${{ inputs.platform_version }}
          SMOKE_EXPECT_VERSION: ${{ inputs.platform_version }}
          SMOKE_EXPECT_COMMIT: ${{ github.sha }}
        run: sh apps/platform/docker/smoke-test.sh
      - name: Scan historical image tags
        if: always() && matrix.arch == 'amd64'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: node scripts/release/scan-image-tags.mjs --window=10 --image="$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Write smoke summary
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM_VERSION: ${{ inputs.platform_version }}
          RELEASE_COMMIT: ${{ github.sha }}
          IMAGE: ghcr.io/${{ github.repository }}:platform-${{ inputs.platform_version }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "## 发布后镜像冒烟（$ARCH）"
            echo ""
            echo "- 镜像：\`$IMAGE\`"
            echo "- 期望版本：\`$PLATFORM_VERSION\` / commit \`$RELEASE_COMMIT\`"
            if [ "$SMOKE_OUTCOME" = "success" ]; then
              echo "- 结论：**通过**（原生 $ARCH 运行 /api/health，版本与 commit 断言一致）"
            else
              echo "- 结论：**失败（未证实）**——冒烟未通过；镜像发布结论不变，失败原因见本 job 的「Pull image」/「Run image smoke test」日志"
              echo "::warning::[$ARCH] 发布后镜像冒烟失败（platform-$PLATFORM_VERSION），不得视为运行通过"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
