name: Probe GitHub Token Access

# 临时诊断 workflow（T-G2-2）：验证 GITHUB_TOKEN 对 Code Scanning / Dependabot
# alerts API 的可访问性。验证完成后删除本文件。
on:
  workflow_dispatch:

permissions:
  security-events: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe alerts APIs with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          for ENDPOINT in code-scanning/alerts dependabot/alerts; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/${ENDPOINT}?per_page=1")
            echo "${ENDPOINT}: HTTP ${CODE}"
          done
