name: Release
on:
  # 0.x 阶段仅手动发布（workflow_dispatch）；1.0.0 正式版发布前不启用任何自动触发
  workflow_dispatch:
  # 定时自动发布（参照 momei）：每周六 UTC+0 12:00 = UTC+8 20:00
  # 1.0.0 正式版发布后取消注释即可启用（自动发布逻辑已内嵌于 Auto version 步骤）
  # schedule:
  #   - cron: "0 12 * * 6"
  # 1.0.0 正式版发布后如需提交即发布，可取消注释：
  # push:
  #   branches:
  #     - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # OIDC trusted publishing：pnpm publish 通过 OIDC token 交换获得临时发布凭据，无需 NPM_TOKEN
      id-token: write
      # 推送 changeset publish 创建的 <pkg>@<version> git tag
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      # changeset publish 内部会用 npm info 探测 registry 版本，保持 npm 工具链较新以兼容输出格式
      - name: Upgrade npm
        run: npm install -g npm@latest
      - run: pnpm i --frozen-lockfile
      # Nuxt 平台 eslint 依赖 .nuxt/tsconfig.json（Nuxt 生成的类型），需先 prepare 生成
      - run: pnpm --filter @dependfix/platform exec nuxt prepare

      # 定时发布（schedule 触发时自动完成版本提升 + CHANGELOG 生成 + 提交推送）：
      # - 手动发布（workflow_dispatch）时版本已在本地通过 changeset version + pnpm changelog
      #   提升并提交，此步骤跳过；
      # - 没有待发布的 changeset 时全流程无操作（changeset version 无变更退出，
      #   changelog 幂等生成，git commit 跳过；后续质量门 / 校验 / publish 均安全 no-op）；
      # - 提交推送使用 GITHUB_TOKEN（x-access-token 方式，checkout 为 persist-credentials: false）。
      # 1.0.0 正式版发布后取消上方 schedule 注释即启用。
      - name: Auto version & changelog (schedule only)
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset version
          pnpm changelog
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::没有待发布的 changeset，定时发布无操作"
          else
            # GitHub runner 默认无 git 身份，需要显式配置（github-actions[bot] 官方身份）
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # semantic-release 风格提交信息：标题带版本号 + body 附根 CHANGELOG 版本段全文
            # （参考 momei semantic-release 提交 `chore(release): <version> [skip ci]`）
            cli_version=$(node -p "require('./packages/cli/package.json').version")
            core_version=$(node -p "require('./packages/core/package.json').version")
            head_cli_version=$(git show HEAD:packages/cli/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || echo "0.0.0")
            version="$cli_version"
            # 仅 core 变更时（cli 未提升），标题取 core 版本，避免版本号与变更不符
            if [ "$cli_version" = "$head_cli_version" ]; then
              version="$core_version"
            fi
            # 仅提取最新版本段（`# 0.1.0 (date)` 到下一个 `# ` 版本段前），
            # 避免 commit body 随 changelog 历史无界膨胀（Review Gate P2）
            release_notes=$(awk '/^# [0-9]/{ if (n) exit; n = 1 } n { print }' CHANGELOG.md)
            if [ -z "$release_notes" ]; then
              echo "::error::CHANGELOG.md 缺少版本段，无法生成 release commit body"
              exit 1
            fi
            git commit -m "chore(release): ${version} [skip ci]" -m "$release_notes"
            # 分支为当前默认分支 master（与 changeset config 的 baseBranch 一致）
            git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
            git push origin master
          fi

      - run: pnpm run lint
      - run: pnpm run lint:md:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      # CHANGELOG 校验：发布前确认各份 CHANGELOG（根级 + 全部发布包级）已包含当前版本段。
      # 包清单来自单点配置 scripts/packages.config.mjs（新增发布包只改一处，此处自动生效）。
      # CHANGELOG 由本地 `pnpm changelog`（conventional-changelog-cmyr-config）生成并随
      # 发布提交入库，CI 不重新生成；若版本已提升但日志缺失，说明漏跑了生成步骤，禁止发布。
      # 普通提交（版本未变）时各日志已含对应版本段，校验自动通过。
      # 段标题兼容 minor（`# [0.x.0]`）与 patch（`## [0.x.y]`，cmyr-config 按 isPatch 输出）两种前缀。
      # 注意：正则须为 POSIX ERE 兼容写法（CI 用 grep -E 校验）——字符类内 `\]` 不代表字面 `]`，
      # 须用分组 `(\]| |\$)`：`\]` 匹配 `# [0.x.0]` 的右括号、空格匹配 `# 0.x.0 (date)` 无链接
      # 标题的版本后空白、`\$` 匹配纯版本标题的行尾。
      - name: Verify changelog is up to date
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            import { PUBLISHABLE_PACKAGES } from "./scripts/packages.config.mjs"
            const specs = PUBLISHABLE_PACKAGES.map((p) => `${p.path}:${p.changelog}`)
            specs.push(`__root__:CHANGELOG.md`)
            process.stdout.write(specs.join(" ") + "\n")
          ' > /tmp/changelog-specs.txt
          for spec in $(cat /tmp/changelog-specs.txt); do
            dir="${spec%%:*}"; file="${spec##*:}"
            if [ "$dir" = "__root__" ]; then
              version=$(node -p "require('./packages/cli/package.json').version")
            else
              version=$(node -p "require('./$dir/package.json').version")
            fi
            if ! grep -qE "^#{1,2} \[?${version}(\]| |\$)" "$file"; then
              echo "::error::$file 缺少版本段 ${version}，请先运行 pnpm changelog 并提交"
              exit 1
            fi
          done
          echo "changelog is up to date"

      # changeset publish：
      # - 判断依据是"本地版本未出现在 npm registry 已发布版本列表"（npm info 对比），
      #   与 .changeset/ 目录是否存在无关（changeset version 已消费并删除 changeset 文件）；
      #   无待发布版本时安全退出，天然处理包版本不同步
      # - 在 pnpm 项目内部调用 pnpm publish（自动将 workspace:* 替换为实际版本）
      # - 通过 OIDC（id-token: write）完成 npm trusted publishing 认证，无需 NPM_TOKEN
      # - 发布成功后仅在本地创建 <pkg>@<version> 格式的 git tag（--no-git-tag 可关闭）
      - name: Changeset Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm changeset publish

      # changeset publish 只创建本地 tag，需要显式推送（checkout 使用 persist-credentials: false，
      # 通过 x-access-token 方式用 GITHUB_TOKEN 认证推送）。
      # 教训（2026-08-08 实证）：`git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf
      # "https://github.com/"` + `git push origin --tags` 在 CI 下实测输出 "Everything up-to-date" 但 tag
      # 未推送（远程始终缺 changeset 创建的 tag，run 31208208621）——insteadOf 的 URL 替换在 Actions
      # checkout（fetch-tags: false + persist-credentials: false）环境下不可靠。
      # 改用显式带 token 的 push URL（官方推荐模式），并推送后核验 tag 已同步远程（失败即报错）。
      - name: Push release tags
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --tags
          # 核验：本次 workflow 中 changeset 创建的 tag 是否已出现在远程
          git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --tags
          local_tags=$(git tag)
          remote_tags=$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --tags | awk '{print $2}' | sed 's|refs/tags/||')
          missing=""
          for t in $local_tags; do
            case " $remote_tags " in
              *" $t "*) ;;
              *) missing="$missing $t" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::以下 tag 未同步到远程（推送失败或未生成）：$missing"
            exit 1
          fi
          echo "all release tags pushed to remote"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
