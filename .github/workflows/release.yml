name: Release
on:
  # 0.x 阶段仅手动发布（workflow_dispatch）；1.0.0 正式版发布前不启用任何自动触发
  workflow_dispatch:
  # 定时自动发布（参照 momei）：每周六 UTC+0 12:00 = UTC+8 20:00
  # 1.0.0 正式版发布后取消注释即可启用（自动发布逻辑已内嵌于 Auto version 步骤）
  # schedule:
  #   - cron: "0 12 * * 6"
  # 1.0.0 正式版发布后如需提交即发布，可取消注释：
  # push:
  #   branches:
  #     - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # OIDC trusted publishing：pnpm publish 通过 OIDC token 交换获得临时发布凭据，无需 NPM_TOKEN
      id-token: write
      # 推送 release:publish 创建的 <pkg>@<version> git tag
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm i --frozen-lockfile
      # Nuxt 平台 eslint 依赖 .nuxt/tsconfig.json（Nuxt 生成的类型），需先 prepare 生成
      - run: pnpm --filter @dependfix/platform exec nuxt prepare
      # 平台 server 代码 import dependfix、@dependfix/core、@dependfix/engine 的 dist 类型声明（Nuxt tsconfig 不映射 workspace 源码）：
      # CI 中 pnpm i 不构建 workspace 包，必须先构建 core+engine+cli 否则 lint/typecheck 类型解析失败
      # （顺序与 test.yml / Dockerfile 的 core → engine → cli → platform 一致）
      - run: pnpm --filter @dependfix/core build && pnpm --filter @dependfix/engine build && pnpm --filter dependfix build

      # 定时发布（schedule 触发时自动完成版本提升 + CHANGELOG 生成 + 提交推送）：
      # - 手动发布（workflow_dispatch）时版本已在本地通过 release:plan + release:version
      #   + pnpm changelog 提升并提交，此步骤跳过；
      # - 没有待发布变更时全流程无操作（release:plan 无推导结果不生成计划文件，
      #   release:version 无计划可消费时报错会中断——因此前置防御性清理残留计划文件；
      #   changelog 幂等生成，git commit 跳过；后续质量门 / 校验 / publish 均安全 no-op）；
      # - 提交推送使用 GITHUB_TOKEN（x-access-token 方式，checkout 为 persist-credentials: false）。
      # 1.0.0 正式版发布后取消上方 schedule 注释即启用。
      - name: Auto version & changelog (schedule only)
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f release-plan.md
          pnpm release:plan
          if [ -f release-plan.md ]; then
            pnpm release:version
          else
            echo "::notice::没有待提升的版本，跳过 release:version"
          fi
          pnpm changelog
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::没有待发布的版本变更，定时发布无操作"
          else
            # GitHub runner 默认无 git 身份，需要显式配置（github-actions[bot] 官方身份）
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # semantic-release 风格提交信息：标题带版本号 + body 附根 CHANGELOG 版本段全文
            # （参考 momei semantic-release 提交 `chore(release): <version> [skip ci]`）
            cli_version=$(node -p "require('./packages/cli/package.json').version")
            core_version=$(node -p "require('./packages/core/package.json').version")
            head_cli_version=$(git show HEAD:packages/cli/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || echo "0.0.0")
            version="$cli_version"
            # 仅 core 变更时（cli 未提升），标题取 core 版本，避免版本号与变更不符
            if [ "$cli_version" = "$head_cli_version" ]; then
              version="$core_version"
            fi
            # 仅提取最新版本段（`# 0.1.0 (date)` 到下一个 `# ` 版本段前），
            # 避免 commit body 随 changelog 历史无界膨胀（Review Gate P2）
            release_notes=$(awk '/^# [0-9]/{ if (n) exit; n = 1 } n { print }' CHANGELOG.md)
            if [ -z "$release_notes" ]; then
              echo "::error::CHANGELOG.md 缺少版本段，无法生成 release commit body"
              exit 1
            fi
            git commit -m "chore(release): ${version} [skip ci]" -m "$release_notes"
            # 分支为当前默认分支 master（release:version 消费计划后无 baseBranch 概念，固定 master）
            git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
            git push origin master
          fi

      - run: pnpm run lint
      - run: pnpm run lint:md:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      # CHANGELOG 校验：发布前确认各份 CHANGELOG（根级 + 全部发布包级）已包含当前版本段。
      # 包清单来自单点配置 scripts/packages.config.mjs（新增发布包自动生效）。
      # CHANGELOG 由本地 `pnpm changelog` 生成并随发布提交入库，CI 不重新生成；
      # 若版本已提升但日志缺失，说明漏跑了生成步骤，禁止发布（详见 scripts/verify-changelog.mjs）。
      - name: Verify changelog is up to date
        run: pnpm verify:changelog

      # release:publish：
      # - 判断依据是"本地版本未出现在 npm registry 已发布版本列表"（fetch 直连
      #   registry 对比），与 release-plan.md 是否存在无关（release:version 已消费删除）；
      #   无待发布版本时安全退出，天然处理包版本不同步
      # - 底层调用 pnpm publish（自动将 workspace:* 替换为实际版本）
      # - 通过 OIDC（id-token: write）完成 npm trusted publishing 认证，无需 NPM_TOKEN
      # - 发布成功后创建 <pkg>@<version> 格式的 annotated git tag（指向 HEAD，
      #   HEAD 锚点校验：HEAD 必须 touch 待发布包路径，防误发布）
      - name: Release Publish
        run: pnpm release:publish

      # release:publish 只创建本地 tag，需要显式推送（checkout 使用 persist-credentials: false，
      # 通过 x-access-token 方式用 GITHUB_TOKEN 认证推送）。
      # 教训（2026-08-08 实证，经验归档 §二十六）：insteadOf 全局 URL 替换在 Actions
      # checkout 环境下不可靠（实测 "Everything up-to-date" 但 tag 未推送，run 31208208621）——
      # 改用显式带 token 的 push URL（官方推荐模式），并推送后核验 tag 已同步远程（失败即报错）。
      # 详见 scripts/push-release-tags.mjs。
      - name: Push release tags
        run: pnpm release:push-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 聚合 GitHub Release：读 release-publish-result.json（release:publish 产物），
      # 提取根 CHANGELOG 段（core-only 取锚包包级段）+ 版本矩阵，gh release create。
      # 注意：v<锚版本> tag 已由 release:publish 创建并随上方 Push release tags 全量
      # 推送核验，本步骤只创建 Release 对象（gh release create 不改仓库文件）。
      # 幂等：Release 已存在跳过；创建失败 ::warning:: 不阻断（npm 已发布完成）。
      - name: Create GitHub Release
        run: pnpm release:github
