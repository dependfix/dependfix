name: Release
on:
  # 0.x 阶段仅手动发布（workflow_dispatch）；1.0.0 正式版发布前不启用任何自动触发
  workflow_dispatch:
  # 定时自动发布（参照 momei）：每周六 UTC+0 12:00 = UTC+8 20:00
  # 1.0.0 正式版发布后取消注释即可启用（自动发布逻辑已内嵌于 Auto version 步骤）
  # schedule:
  #   - cron: "0 12 * * 6"
  # 1.0.0 正式版发布后如需提交即发布，可取消注释：
  # push:
  #   branches:
  #     - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # OIDC trusted publishing：pnpm publish 通过 OIDC token 交换获得临时发布凭据，无需 NPM_TOKEN
      id-token: write
      # 推送 changeset publish 创建的 <pkg>@<version> git tag
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      # changeset publish 内部会用 npm info 探测 registry 版本，保持 npm 工具链较新以兼容输出格式
      - name: Upgrade npm
        run: npm install -g npm@latest
      - run: pnpm i --frozen-lockfile

      # 定时发布（schedule 触发时自动完成版本提升 + CHANGELOG 生成 + 提交推送）：
      # - 手动发布（workflow_dispatch）时版本已在本地通过 changeset version + pnpm changelog
      #   提升并提交，此步骤跳过；
      # - 没有待发布的 changeset 时全流程无操作（changeset version 无变更退出，
      #   changelog 幂等生成，git commit 跳过；后续质量门 / 校验 / publish 均安全 no-op）；
      # - 提交推送使用 GITHUB_TOKEN（x-access-token 方式，checkout 为 persist-credentials: false）。
      # 1.0.0 正式版发布后取消上方 schedule 注释即启用。
      - name: Auto version & changelog (schedule only)
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset version
          pnpm changelog
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::没有待发布的 changeset，定时发布无操作"
          else
            # GitHub runner 默认无 git 身份，需要显式配置（github-actions[bot] 官方身份）
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(release): 定时发布版本提升"
            # 分支为当前默认分支 master（与 changeset config 的 baseBranch 一致）
            git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
            git push origin master
          fi

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      # CHANGELOG 校验：发布前确认三份 CHANGELOG 已包含当前版本段。
      # CHANGELOG 由本地 `pnpm changelog`（conventional-changelog-cmyr-config）生成并随
      # 发布提交入库，CI 不重新生成；若版本已提升但日志缺失，说明漏跑了生成步骤，禁止发布。
      # 普通提交（版本未变）时各日志已含对应版本段，校验自动通过。
      - name: Verify changelog is up to date
        run: |
          for spec in "packages/cli:packages/cli/CHANGELOG.md" "packages/core:packages/core/CHANGELOG.md"; do
            dir="${spec%%:*}"; file="${spec##*:}"
            version=$(node -p "require('./$dir/package.json').version")
            if ! grep -qE "^# \[?${version}([ )]|\$)" "$file"; then
              echo "::error::$file 缺少版本段 ${version}，请先运行 pnpm changelog 并提交"
              exit 1
            fi
          done
          version=$(node -p "require('./packages/cli/package.json').version")
          if ! grep -qE "^# \[?${version}([ )]|\$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少版本段 ${version}，请先运行 pnpm changelog 并提交"
            exit 1
          fi
          echo "changelog is up to date"

      # changeset publish：
      # - 只发布有 changeset 记录的包（无变更时安全退出，天然处理包版本不同步）
      # - 在 pnpm 项目内部调用 pnpm publish（自动将 workspace:* 替换为实际版本）
      # - 通过 OIDC（id-token: write）完成 npm trusted publishing 认证，无需 NPM_TOKEN
      # - 发布成功后仅在本地创建 <pkg>@<version> 格式的 git tag（--no-git-tag 可关闭）
      - name: Changeset Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm changeset publish

      # changeset publish 只创建本地 tag，需要显式推送（checkout 使用 persist-credentials: false，
      # 通过 x-access-token 方式用 GITHUB_TOKEN 认证推送）
      - name: Push release tags
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git push origin --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
