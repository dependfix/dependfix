name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: "11.17.0"
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check:links
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
