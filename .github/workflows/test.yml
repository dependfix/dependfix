name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # 依赖审计（决策依据：docs/design/governance/c22-pat-backward-compat.md §5.5 决策 C 缓解措施 4；
      # 覆盖范围修订依据：M29.9「C80-A devDeps 链漏洞可见性（去 --prod）」，见 docs/plan/todo-archive.md）：
      # - pnpm.overrides 钉定 @octokit/auth-app=8.3.0（pnpm-workspace.yaml）
      # - 覆盖 prod + devDeps：原 `--prod` 只看 prod deps；devDeps 链同样需要治理
      #   （docs 工具链的 vite 漏洞只能从 devDeps 侧修复，实证见 docs/plan/todo.md M29.1），
      #   故改为全量 audit 以取得同步 PR 级信号
      # - --audit-level=moderate 包含 high + critical（Dependabot 默认告警阈值）
      # - 失败不阻断 Test job（|| true）：audit 失败仅作为信号——2026-09-30 用户决策方案 C（观察期），
      #   避免上游新披露 devDeps 漏洞突然红掉 Test workflow / 阻塞无关 PR
      #   （security alerts / updates 由 repo 级 Dependabot 设置提供，不是 dependabot.yml 的配置项）
      # - **转正条件（可判定）**：自存量清零（2026-09-30，audit 13 条 → 0）起，连续 3 次 master push
      #   的 Test workflow 中本步骤输出 clean（日志含 "No known vulnerabilities found" 且无
      #   "vulnerabilities found"）→ 移除 || true 并追加 --ignore-registry-errors
      #   （pnpm 11.17.0 支持：registry 报错时退出码 0，避免 registry 故障把 CI 判红）。
      #   口径权威见 docs/standards/security.md §5.6；统计命令：
      #     for id in $(gh run list --workflow test.yml --branch master --event push --limit 3 --json databaseId --jq '.[].databaseId'); do
      #       job=$(gh run view "$id" --json jobs --jq '.jobs[] | select(.name=="Test") | .databaseId')
      #       gh run view --job "$job" --log | grep -q "No known vulnerabilities found" && echo "$id CLEAN" || echo "$id NOT-CLEAN"
      #     done
      # - 本地复现须显式指定公共 registry（默认 npmmirror 无 audit endpoint）：
      #   pnpm audit --audit-level=moderate --registry=https://registry.npmjs.org
      # - 升级 @octokit/auth-app 前必须重跑 e2e（回归范围见 docs/plan/archive/todo-archive-phases-m18.md）+ 评估 breaking change
      - name: pnpm audit (all deps, moderate+)
        run: pnpm audit --audit-level=moderate || true
      # Nuxt 平台 eslint 依赖 .nuxt/tsconfig.json（Nuxt 生成的类型），需先 prepare 生成
      - run: pnpm --filter @dependfix/platform exec nuxt prepare
      # 平台 server 代码 import dependfix、@dependfix/core、@dependfix/engine 的 dist 类型声明（Nuxt tsconfig 不映射 workspace 源码）：
      # CI 中 pnpm i 不构建 workspace 包，必须先构建 core+engine+cli 否则 lint/typecheck 类型解析失败
      # （本地开发因存在 dist 不触发；顺序与 Dockerfile 的 core → engine → cli → platform 一致）
      - run: pnpm --filter @dependfix/core build && pnpm --filter @dependfix/engine build && pnpm --filter dependfix build
      - run: pnpm run lint
      # i18n 校验：lint:i18n 单独执行（@intlify/vue-i18n 规则较慢，不并入常规 lint）；
      # i18n:audit:missing 缺词 parity 作为 blocker；docs:check:i18n 防旧目录回流；
      # i18n:check:anchor 检测 locale 文件 anchor 错位污染（en-US.json 被中文污染等）
      - run: pnpm run lint:i18n
      - run: pnpm run i18n:audit:missing
      - run: pnpm run i18n:check:anchor
      - run: pnpm run docs:check:i18n
      - run: pnpm run lint:md:check
      - run: pnpm run check:docs
      # README 双向链接 + 章节结构一致性门禁（依赖中文 README + README.en-US.md 同存在；
      # 背景见 docs/plan/archive/todo-archive-phases-m26.md）
      - run: pnpm run check:readme-i18n
      # 孤立规划编号门禁（开发规范 §3 注释规范）：扫描非 docs/ 源码 / 配置 / 脚本注释中的无文档指针
      # 规划编号，命中即 exit 1 阻断——防止存量清理后回流。脚本零依赖，故置于静态检查簇内、
      # docs:build / typecheck / test 之前，尽早失败（输出为文件:行:编号明细，便于直接定位）。
      # 阻断强度：workflow 级阻断信号（仓库未配置 required status checks，与 visual job 同口径）
      - run: pnpm run check:orphan-ids
      # docs 构建前置：VitePress 会把 markdown 中的裸 HTML 当作 Vue 模板编译（缺结束标签即失败），
      # lint-md/check-docs 均不检查标签配对——docs 构建失败必须尽早暴露，不等 typecheck/test/build 跑完
      # （教训见经验归档 §三十三：release.md 裸 <path> 导致 Test/Pages 双 workflow 在末尾构建才失败）
      - run: pnpm run docs:build
      - run: pnpm run typecheck
      - run: pnpm run test
      # docs 已在前置步骤独立构建验证，此处排除避免重复构建
      - run: pnpm -r --filter=!dependfix-docs build

  # ===============================================================
  #  E2E — 平台浏览器端到端测试（Playwright，参考 momei）
  #  e2e 服务端使用构建产物 .output/server/index.mjs（独立端口 + 独立库）
  # ===============================================================
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # e2e 需上传测试报告 artifact：upload-artifact 走 Actions 内部 API，
      # 需 actions: write（仅 contents: read 会把未列出的 actions 域置为 none 导致上传失败）
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # 平台 server 依赖 workspace 包 dist 类型；e2e 服务端用构建产物，需完整构建链
      - run: pnpm --filter @dependfix/core build && pnpm --filter @dependfix/engine build && pnpm --filter dependfix build
      - run: pnpm --filter @dependfix/platform build
      - name: Install Playwright Browsers
        run: pnpm --filter @dependfix/platform exec playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: apps/platform
        run: pnpm exec playwright test
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: apps/platform/test-results/
          retention-days: 7

  # ===============================================================
  #  Visual Regression — 平台视觉回归最小集（独立 Playwright config）
  #  与 e2e 完全隔离（独立 config / 端口 / SQLite 库 / 认证目录），不并入 testMatch；
  #  基线快照入仓库 apps/platform/tests/visual/__screenshots__/（可在 PR 中 review 差异）。
  # 阻断语义（2026-09-30 转正）：初期非阻断开关已移除——首个 ubuntu-latest 全绿 run 为
  #  CI run 36602407382（2026-09-29，job conclusion = success，14 步全绿），基线采集环境与
  #  runner 字体渲染一致性已实证。视觉失败现使 Test workflow 变红（**workflow 级阻断信号**；
  #  仓库未配置 required status checks，故不构成硬性合并门禁）。口径见 docs/standards/testing.md §6.7。
  # ===============================================================
  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # 上传失败产物 artifact 需 actions: write（与 e2e job 同因）
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # 视觉套件跑构建产物（.output），需完整构建链（与 e2e job 一致）
      - run: pnpm --filter @dependfix/core build && pnpm --filter @dependfix/engine build && pnpm --filter dependfix build
      - run: pnpm --filter @dependfix/platform build
      - name: Install Playwright Browsers
        run: pnpm --filter @dependfix/platform exec playwright install --with-deps chromium
      - name: Run visual regression
        working-directory: apps/platform
        run: pnpm run test:visual
      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-artifacts
          # 与 e2e job 同口径：整个 test-results/ 一并上传（含 CI reporter 的 blob 报告
          # test-results/visual-blob/、失败截图 -actual/-diff）；playwright-report/ 仅本地 html reporter 产出
          path: apps/platform/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ===============================================================
  #  Coverage — 覆盖率统计并上报 Codecov
  #  （需要仓库配置 CODECOV_TOKEN secret，见
  #   https://docs.codecov.com/docs/quick-start#set-your-repository-upload-token）
  # ===============================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # platform 测试文件 import 类型依赖 Nuxt 生成的 .nuxt/tsconfig.json（vitest 转换时读取），
      # coverage job 独立于 test job，需单独 prepare；顺序与 test job 保持一致
      - run: pnpm --filter @dependfix/platform exec nuxt prepare
      - run: pnpm run test:coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
