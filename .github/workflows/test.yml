name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # 依赖审计（决策依据：docs/design/governance/c22-pat-backward-compat.md §5.5 决策 C 缓解措施 4）：
      # - **全量信号（保留）**：`pnpm audit --audit-level=moderate --registry=https://registry.npmjs.org || true`
      #   覆盖 prod + devDeps（原 `--prod` 只看 prod，devDeps 链同样需要治理，见 M29.1）；
      #   失败仅作信号，不阻断 Test job（2026-09-30 方案 C 的 devDeps 可见性目的不变）。
      # - **prod 阻断（2026-10-27 转正）**：`pnpm audit --prod --audit-level=moderate
      #   --ignore-registry-errors --registry=https://registry.npmjs.org`，无 `|| true`。
      #   显式 `--registry` 固定公共 audit endpoint，避免 runner / 本地镜像无 audit endpoint 时
      #   被 `--ignore-registry-errors` 误判为通过；该 flag 只把 registry 故障降为 exit 0，
      #   不放宽漏洞判定（pnpm 11.17.0 实测：registry 不可达 + flag → exit 0；无 flag → exit 1；
      #   真实漏洞 + flag → exit 1）。
      #   `pnpm-workspace.yaml` 的 `audit.ignore`（当前仅 minimatch，无兼容修复版本，见 security.md §5.7）
      #   仍生效；阻断判据为步骤 exit 0，ignored 条目不参与阻断——日志可能出现
      #   "N vulnerabilities found ... (N ignored)"，不再依赖 "No known vulnerabilities found" 字面串。
      #   口径与转正 run id 见 docs/standards/security.md §5.6。
      # - 本地复现：`pnpm audit --prod --audit-level=moderate --registry=https://registry.npmjs.org`
      #   （本地默认 registry 可能无 audit endpoint）。
      # - 升级 @octokit/auth-app 前必须重跑 e2e（回归范围见 docs/plan/archive/todo-archive-phases-m18.md）+ 评估 breaking change
      - name: pnpm audit (all deps, moderate+, signal)
        run: pnpm audit --audit-level=moderate --registry=https://registry.npmjs.org || true
      - name: pnpm audit (prod, moderate+, blocking)
        run: pnpm audit --prod --audit-level=moderate --ignore-registry-errors --registry=https://registry.npmjs.org
      # Nuxt 平台 eslint 依赖 .nuxt/tsconfig.json（Nuxt 生成的类型），需先 prepare 生成
      - run: pnpm --filter @dependfix/platform exec nuxt prepare
      # 平台 server 代码 import dependfix、@dependfix/core、@dependfix/engine 的 dist 类型声明（Nuxt tsconfig 不映射 workspace 源码）：
      # CI 中 pnpm i 不构建 workspace 包，必须先构建 core+engine+cli 否则 lint/typecheck 类型解析失败
      # （本地开发因存在 dist 不触发；顺序与 Dockerfile 的 core → engine → cli → platform 一致）
      - run: pnpm --filter @dependfix/core build && pnpm --filter @dependfix/engine build && pnpm --filter dependfix build
      - run: pnpm run lint:check
      - run: pnpm run lint:css:check
      # i18n 校验：lint:i18n 单独执行（@intlify/vue-i18n 规则较慢，不并入常规 lint）；
      # i18n:audit:missing 缺词 parity 作为 blocker；docs:check:i18n 防旧目录回流；
      # i18n:check:anchor 检测 locale 文件 anchor 错位污染（en-US.json 被中文污染等）
      - run: pnpm run lint:i18n
      - run: pnpm run i18n:audit:missing
      - run: pnpm run i18n:check:anchor
      - run: pnpm run docs:check:i18n
      - run: pnpm run lint:md:check
      # check:docs 规则面八类：links（路径/锚点/绝对路径/穿越/gitignore/正文机器路径）+
      # vue-interp（Vue 插值）+ link-text（链接文本 §N ↔ 锚点编号）+ link-syntax（畸形链接）+
      # emphasis（** 未配对）+ site-links（站点静态绝对链接）+ archive-anchors（归档锚点子集，file-dead 豁免）+
      # anchor-id（站内锚点必须是 VitePress 产物 id）；
      # 覆盖面与边界（含运行期生成链接不在静态面内）见 docs/standards/documentation.md §2。
      # 负例标定：五类各植入 1 个最小负例 → exit 1 且输出 文件:行:明细；还原后 exit 0（2026-10-14 本地已验）。
      - run: pnpm run check:docs
      # 中英指南平价：env 变量 / CLI 参数 / Action 输入 / 章节骨架（en ⊇ zh），文案措辞不在面内
      - run: pnpm run docs:check:guides
      # en 设计镜像结构映射：zh 分片 / en 镜像 / mirror-manifest 三方一致 + 每页 H2 映射逐条校验
      - run: pnpm run docs:check:mirror
      # README 双向链接 + 章节结构一致性门禁（依赖中文 README + README.en-US.md 同存在；
      # 背景见 docs/plan/archive/todo-archive-phases-m26.md）
      - run: pnpm run check:readme-i18n
      # 孤立规划编号门禁（开发规范 §3 注释规范）：扫描非 docs/ 源码 / 配置 / 脚本注释中的无文档指针
      # 规划编号，命中即 exit 1 阻断——防止存量清理后回流。脚本零依赖，故置于静态检查簇内、
      # docs:build / typecheck / test 之前，尽早失败（输出为文件:行:编号明细，便于直接定位）。
      # 阻断强度：workflow 级阻断信号（仓库未配置 required status checks，与 visual job 同口径）
      - run: pnpm run check:orphan-ids
      # 规范冗余关键词门禁（开发/文档规范）：docs/standards 只写规则，不写"案例/教训/实证"类
      # 叙事；豁免行内代码、fenced code block 与 markdown 链接整体（链接是导航而非散文）。
      # 负例标定：在 docs/standards 任一文件植入关键词即 exit 1（本地已验），修复后删除脚手架。
      # 自指面：本文件为 yml，不在脚本扫描面（仅 md）内，新增注释不参与扫描。
      # 阻断强度：workflow 级阻断信号（仓库未配置 required status checks，与 visual job 同口径）
      - run: pnpm run check:standards-redundant:strict
      # 文档行数阈值门禁：阈值取自 docs/standards/documentation.md §3（单一事实源，脚本不硬编码）；
      # 超「强制分片」阈值 exit 1，warning 带仅报告不阻断；存量超标以脚本内豁免表显式登记。
      # 负例标定：向声明行命中的文档追加超阈值行数即 exit 1（本地已验），修复后还原。
      # 自指面：本文件为 yml，不在脚本扫描面（仅 md）内，新增注释不参与扫描。
      # 阻断强度：workflow 级阻断信号（仓库未配置 required status checks，与 visual job 同口径）。
      - run: pnpm run check:doc-size
      # 文档治理结构与密度门禁：字符预算与规则条数预算取自
      # docs/design/governance/doc-governance.md §4.2（单一事实源，脚本不硬编码）；
      # 归档索引必须覆盖全部阶段分片、倒序、无正文标题、无重复（todo-archive.md 只做索引）；
      # 超阻断列或归档结构不满足不变量即 exit 1；freshness warning 仅报告不阻断。
      # 负例标定：索引漏登记一个分片 / 把阶段正文写回索引即 exit 1（本地已验）。
      # 自指面：本文件为 yml，不在脚本扫描面（仅 md）内，新增注释不参与扫描。
      # 阻断强度：workflow 级阻断信号（仓库未配置 required status checks，与 visual job 同口径）。
      - run: pnpm run check:doc-governance
      # 经验条目落点门禁：每个经验归档条目必须含非空「落点」（L1 脚本 / L2 检查点 / 规范条款），
      # 占位符视为空——对治「只留条目、不留落点」反模式。脚本零依赖，置于静态检查簇内。
      # 负例标定：新增无落点条目即 exit 1（本地已验），修复后删除脚手架。
      # 自指面：本文件为 yml，不在脚本扫描面（仅 md）内，新增注释不参与扫描。
      # 阻断强度：workflow 级阻断信号（仓库未配置 required status checks，与 visual job 同口径）。
      - run: pnpm run check:experience-landing
      # 自用验证链一致性门禁：本仓库 .github/workflows/security-auto-fix.yml 的自用 `commands` 链
      # 必须覆盖引擎默认链（packages/engine/src/runners/verification-runner.ts）的全部语义项——
      # CLI `--commands` 为整链替换语义，默认链扩展不会自动跟随自用链；差异项须在脚本声明表中显式登记。
      # 负例标定：从自用链删去任一默认链语义项即 exit 1（本地已验），还原后 exit 0。
      # 自指面：本文件为 yml，不在脚本比对的两处事实源内，新增注释不参与判定。
      # 阻断强度：workflow 级阻断信号（仓库未配置 required status checks，与 visual job 同口径）。
      - run: pnpm run check:verify-chain
      # mergify 合并门禁一致性：`.github/mergify.yml` 的每条 merge 规则必须覆盖**全部 workflow** 中
      # `pull_request` 触发 workflow 的 PR job 并集（`check-success` 按 job 名匹配，Test 不覆盖
      # Coverage / E2E / Visual Regression），且 dependabot / dependfix 两类 bot author 规则齐备。
      # 任一 workflow 新增 PR job 或 mergify 条件漂移即失败。
      # 负例标定：从任一规则删去 `check-success=Coverage` 即 exit 1（本地已验），还原后 exit 0。
      # 自指面：本文件**就是** job 名事实源（脚本扫 `.github/workflows/*.yml` 的 pull_request job）——
      # 新增 job 会自动进入门禁比对（`name` 优先于 job key），规则未同步即失败。
      # 阻断强度：workflow 级阻断信号（仓库未配置 required status checks，与 visual job 同口径）。
      - run: pnpm run check:mergify
      # docs 构建前置：VitePress 会把 markdown 中的裸 HTML 当作 Vue 模板编译（缺结束标签即失败），
      # lint-md/check-docs 均不检查标签配对——docs 构建失败必须尽早暴露，不等 typecheck/test/build 跑完
      # （教训见经验归档 §三十三：release.md 裸 <path> 导致 Test/Pages 双 workflow 在末尾构建才失败）
      - run: pnpm run docs:build
      # 锚点实证：以刚构建出的产物 HTML 的 id 复核全部站内锚点（check:docs 的 anchor-id 用内置
      # slugify 推算，本步用真实产物兜底——VitePress 升级若改 slug 规则，两者会一起显形）。
      - run: pnpm run docs:check:anchors
      # 未翻译页的语言切换目标必须可用（构建期生成的兜底入口页 + 目标标记 + 点击补丁）：
      # 复用上一步同一份 dist，零额外构建成本；依据 [i18n 规范 §2.1](../../docs/standards/i18n.md)。
      - run: pnpm run docs:check:fallback
      - run: pnpm run typecheck
      - run: pnpm run test
      # docs 已在前置步骤独立构建验证，此处排除避免重复构建
      - run: pnpm -r --filter=!dependfix-docs build

  # ===============================================================
  #  E2E — 平台浏览器端到端测试（Playwright，参考 momei）
  #  e2e 服务端使用构建产物 .output/server/index.mjs（独立端口 + 独立库）
  # ===============================================================
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # e2e 需上传测试报告 artifact：upload-artifact 走 Actions 内部 API，
      # 需 actions: write（仅 contents: read 会把未列出的 actions 域置为 none 导致上传失败）
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # 平台 server 依赖 workspace 包 dist 类型；e2e 服务端用构建产物，需完整构建链
      - run: pnpm --filter @dependfix/core build && pnpm --filter @dependfix/engine build && pnpm --filter dependfix build
      - run: pnpm --filter @dependfix/platform build
      - name: Install Playwright Browsers
        run: pnpm --filter @dependfix/platform exec playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: apps/platform
        run: pnpm exec playwright test
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: apps/platform/test-results/
          retention-days: 7

  # ===============================================================
  #  Visual Regression — 平台视觉回归最小集（独立 Playwright config）
  #  与 e2e 完全隔离（独立 config / 端口 / SQLite 库 / 认证目录），不并入 testMatch；
  #  基线快照入仓库 apps/platform/tests/visual/__screenshots__/（可在 PR 中 review 差异）。
  # 阻断语义（2026-09-30 转正）：初期非阻断开关已移除——首个 ubuntu-latest 全绿 run 为
  #  CI run 36602407382（2026-09-29，job conclusion = success，14 步全绿），基线采集环境与
  #  runner 字体渲染一致性已实证。视觉失败现使 Test workflow 变红（**workflow 级阻断信号**；
  #  仓库未配置 required status checks，故不构成硬性合并门禁）。口径见 docs/standards/testing.md §6.7。
  # ===============================================================
  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # 上传失败产物 artifact 需 actions: write（与 e2e job 同因）
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # 视觉套件跑构建产物（.output），需完整构建链（与 e2e job 一致）
      - run: pnpm --filter @dependfix/core build && pnpm --filter @dependfix/engine build && pnpm --filter dependfix build
      - run: pnpm --filter @dependfix/platform build
      - name: Install Playwright Browsers
        run: pnpm --filter @dependfix/platform exec playwright install --with-deps chromium
      - name: Run visual regression
        working-directory: apps/platform
        run: pnpm run test:visual
      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-artifacts
          # 与 e2e job 同口径：整个 test-results/ 一并上传（含 CI reporter 的 blob 报告
          # test-results/visual-blob/、失败截图 -actual/-diff）；playwright-report/ 仅本地 html reporter 产出
          path: apps/platform/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ===============================================================
  #  Coverage — 覆盖率统计并上报 Codecov
  #  （需要仓库配置 CODECOV_TOKEN secret，见
  #   https://docs.codecov.com/docs/quick-start#set-your-repository-upload-token）
  # ===============================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js@lts environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      # platform 测试文件 import 类型依赖 Nuxt 生成的 .nuxt/tsconfig.json（vitest 转换时读取），
      # coverage job 独立于 test job，需单独 prepare；顺序与 test job 保持一致
      - run: pnpm --filter @dependfix/platform exec nuxt prepare
      - run: pnpm run test:coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
