name: 'Dependfix Security Auto Fix'
description: 'Automated remediation of Dependabot security alerts for pnpm/Node.js projects'
author: 'CaoMeiYouRen'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  mode:
    description: '运行模式'
    required: false
    # Action 默认 fix-and-pr（本地 CLI 默认仍为 report-only）
    default: 'fix-and-pr'
  repos:
    description: '目标仓库（逗号分隔 owner/repo，留空使用当前仓库；与 owner 同时给出时合并去重，显式优先）'
    required: false
    default: ''
  # ── 多仓库治理 ──
  owner:
    description: 'owner / org 自动发现（逗号分隔多个）。注意：GITHUB_TOKEN 仅能访问当前仓库，owner 发现其他仓库必须使用具备仓库读取权限的 PAT（github-token 输入）；如需按仓库隔离权限，建议为每个仓库单独配置 action，而不是跨仓库发现'
    required: false
    default: ''
  repo-topics:
    description: '发现结果 topic 白名单（逗号分隔，AND 语义；仅影响 owner 发现结果）'
    required: false
    default: ''
  repo-include:
    description: '仓库白名单 glob（逗号分隔多个，如 owner/*、owner/pkg-*；仅作用于发现结果）'
    required: false
    default: ''
  repo-exclude:
    description: '仓库黑名单 glob（逗号分隔多个；显式列表与发现结果均受约束，与 include 冲突时胜出）'
    required: false
    default: ''
  repo-topics-exclude:
    description: '发现结果 topic 黑名单（逗号分隔，排除含任一指定 topic 的仓库）'
    required: false
    default: ''
  max-concurrency:
    description: '多仓库并发窗口（1-16，默认 1 保守串行；>1 仅 report-only 模式允许——fix/fix-and-pr 共享单一 workDir，配置校验会拒绝并发）'
    required: false
    default: '1'
  max-retries:
    description: 'GitHub API 限流重试次数（0-10，默认 3；429/rate limit 指数退避重试）'
    required: false
    default: '3'
  severity-threshold:
    description: '严重级别阈值'
    required: false
    default: 'high'
  dry-run:
    description: '试运行模式（不修改文件）'
    required: false
    # 与 mode 默认 fix-and-pr 配套（dryRun 与 createPullRequest 互斥）
    default: 'false'
  max-alerts-per-repository:
    description: '每仓库最多处理的告警数'
    required: false
    default: '20'
  cleanup-branches:
    description: '（fix-and-pr 模式）结束后将已合并的 dependfix 分支列入报告待清理清单（不自动删除）'
    required: false
    default: 'false'
  cleanup-branches-auto:
    description: '（fix-and-pr 模式）结束后自动删除已合并/已关闭的 dependfix 分支（非交互；不删有 open PR 的分支。配合 GitHub 仓库设置 "Automatically delete head branches" 可保持分支零残留）'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub Token（需 security-events 权限；fix-and-pr 模式需 contents + pull-requests 写权限）'
    required: true
  dependabot-alerts-token:
    description: 'Dependabot alerts 专用 token（可选，最小权限 fine-grained PAT，仅需 Dependabot alerts: read；缺省回退 github-token。GITHUB_TOKEN 无法读取 Dependabot alerts API，仅给 GITHUB_TOKEN 会拉取失败）'
    required: false
    default: ''
  code-scanning:
    description: '同时拉取 Code Scanning alerts（与 Dependabot 并行源，默认关闭；需要 token 具备 security-events: read，GITHUB_TOKEN 默认具备）'
    required: false
    default: 'false'
  # ── AI breaking change 研判（与 CLI --ai 系列对齐）──
  ai:
    description: '开启 AI breaking change 研判（默认 false；需配置 ai-api-key；dry-run 不触发不产生费用）'
    required: false
    default: 'false'
  ai-api-key:
    description: 'AI API Key（在 workflow 中引用 secrets.DEEPSEEK_API_KEY 等 GitHub Secrets 传入；经环境变量传递自动打码）'
    required: false
    default: ''
  ai-provider:
    description: 'AI 提供商：openai-compatible（默认，DeepSeek 等）/ anthropic'
    required: false
    default: 'openai-compatible'
  ai-model:
    description: 'AI 模型名（默认 deepseek-v4-flash）'
    required: false
    default: 'deepseek-v4-flash'
  ai-base-url:
    description: 'OpenAI 兼容端点（默认 https://api.deepseek.com，与默认模型配套）'
    required: false
    default: 'https://api.deepseek.com'
  ai-api-url:
    description: 'Anthropic 兼容端点（默认 https://api.anthropic.com/v1/messages；自托管/网关可指定）'
    required: false
    default: ''
  ai-trigger:
    description: 'AI 触发范围：both（默认，验证失败或 major 升级）/ failure / major'
    required: false
    default: 'both'

outputs:
  report-artifact:
    description: '上传的报告 artifact 名称'
    value: ${{ steps.upload-report.outputs.artifact-name }}

runs:
  using: 'composite'
  steps:
    - name: Checkout target repository
      uses: actions/checkout@v7
      # 消费者仓库 checkout 到 $GITHUB_WORKSPACE（重复 checkout 幂等）。
      # dependfix CLI 的修复/提交/推送均作用于该目录；action 自身代码仍在 github.action_path。

    - name: Setup pnpm
      # pnpm 版本由消费者/本仓库 package.json 的 packageManager 字段声明（单一来源），
      # 不传 version 参数（v6 起同时指定且不一致会直接报错）
      uses: pnpm/action-setup@v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*

    - name: Install and build dependfix
      run: |
        cd "${{ github.action_path }}"
        pnpm install --frozen-lockfile
        pnpm --filter dependfix --filter @dependfix/core build
        # Smoke check：确认 CLI bin 可执行、外部依赖可解析（pnpm isolated 布局）
        node "${{ github.action_path }}/packages/cli/dist/bin.mjs" --help > /dev/null
      shell: bash

    - name: Run dependfix
      id: run-dependfix
      run: |
        # 安全模式：所有 input 先赋变量（双花括号模板表达式只在赋值行出现一次，避免命令替换注入面），
        # 再用 bash 数组承载参数（"${args[@]}" 双引号展开不做分词与 glob 展开——
        # repo-include 等 glob 值不会被路径名展开改写，带空格值也不会被拆分）
        MODE="${{ inputs.mode }}"
        SEVERITY_THRESHOLD="${{ inputs.severity-threshold }}"
        MAX_ALERTS="${{ inputs.max-alerts-per-repository }}"
        MAX_CONCURRENCY="${{ inputs.max-concurrency }}"
        MAX_RETRIES="${{ inputs.max-retries }}"
        REPOS="${{ inputs.repos }}"
        OWNER="${{ inputs.owner }}"
        REPO_TOPICS="${{ inputs.repo-topics }}"
        REPO_INCLUDE="${{ inputs.repo-include }}"
        REPO_EXCLUDE="${{ inputs.repo-exclude }}"
        REPO_TOPICS_EXCLUDE="${{ inputs.repo-topics-exclude }}"
        DRY_RUN="${{ inputs.dry-run }}"
        CLEANUP_BRANCHES="${{ inputs.cleanup-branches }}"
        CLEANUP_BRANCHES_AUTO="${{ inputs.cleanup-branches-auto }}"
        CODE_SCANNING="${{ inputs.code-scanning }}"
        if [ -z "$REPOS" ] && [ -z "$OWNER" ]; then
          REPOS="${{ github.repository }}"
        fi
        # CLI 工作目录 = 消费者 checkout；bin 入口指向 action 自身构建产物
        cd "$GITHUB_WORKSPACE"
        args=("$MODE")
        # owner 模式：显式 repos 可选（合并去重）；无 owner 时 repos 兜底当前仓库
        if [ -n "$REPOS" ]; then args+=("--repo" "$REPOS"); fi
        if [ -n "$OWNER" ]; then args+=("--owner" "$OWNER"); fi
        args+=("--severity-threshold" "$SEVERITY_THRESHOLD")
        args+=("--max-alerts-per-repository" "$MAX_ALERTS")
        args+=("--max-concurrency" "$MAX_CONCURRENCY")
        args+=("--max-retries" "$MAX_RETRIES")
        if [ -n "$REPO_TOPICS" ]; then args+=("--repo-topics" "$REPO_TOPICS"); fi
        if [ -n "$REPO_INCLUDE" ]; then args+=("--repo-include" "$REPO_INCLUDE"); fi
        if [ -n "$REPO_EXCLUDE" ]; then args+=("--repo-exclude" "$REPO_EXCLUDE"); fi
        if [ -n "$REPO_TOPICS_EXCLUDE" ]; then args+=("--repo-topics-exclude" "$REPO_TOPICS_EXCLUDE"); fi
        if [ "$DRY_RUN" = 'true' ]; then args+=("--dry-run"); fi
        if [ "$CLEANUP_BRANCHES" = 'true' ]; then args+=("--cleanup-branches"); fi
        if [ "$CLEANUP_BRANCHES_AUTO" = 'true' ]; then args+=("--cleanup-branches-auto"); fi
        if [ "$CODE_SCANNING" = 'true' ]; then args+=("--code-scanning"); fi
        args+=("--verbose")
        node "${{ github.action_path }}/packages/cli/dist/bin.mjs" "${args[@]}"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # Dependabot alerts 专用最小权限 token（经环境变量传递，避免出现在进程列表）
        DEPENDFIX_ALERTS_TOKEN: ${{ inputs.dependabot-alerts-token }}
        # AI 研判（经环境变量传递：api-key 自动打码、不进进程列表）
        DEPENDFIX_AI: ${{ inputs.ai }}
        DEPENDFIX_AI_API_KEY: ${{ inputs.ai-api-key }}
        DEPENDFIX_AI_PROVIDER: ${{ inputs.ai-provider }}
        DEPENDFIX_AI_MODEL: ${{ inputs.ai-model }}
        DEPENDFIX_AI_BASE_URL: ${{ inputs.ai-base-url }}
        DEPENDFIX_AI_API_URL: ${{ inputs.ai-api-url }}
        DEPENDFIX_AI_TRIGGER: ${{ inputs.ai-trigger }}

    - name: Upload report artifact
      id: upload-report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dependfix-report-${{ github.run_id }}
        # 注意：with.path 是表达式上下文，必须用 ${{ }} 展开（裸环境变量不会展开）
        path: ${{ github.workspace }}/dependfix-reports/
        retention-days: 30

    - name: Write workflow summary
      if: always()
      run: |
        FOUND=0
        for f in "$GITHUB_WORKSPACE"/dependfix-reports/dependfix-report-*.md; do
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            FOUND=1
          fi
        done
        if [ "$FOUND" -eq 0 ]; then
          echo "⚠️ No report generated." >> "$GITHUB_STEP_SUMMARY"
        fi
      shell: bash
