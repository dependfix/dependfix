name: 'Dependfix Security Auto Fix'
description: 'Automated remediation of Dependabot security alerts for pnpm/Node.js projects'
author: 'CaoMeiYouRen'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  mode:
    description: '运行模式'
    required: false
    # T209: Action 默认 fix-and-pr（本地 CLI 默认仍为 report-only）
    default: 'fix-and-pr'
  repos:
    description: '目标仓库（逗号分隔 owner/repo，留空使用当前仓库）'
    required: false
    default: ''
  severity-threshold:
    description: '严重级别阈值'
    required: false
    default: 'high'
  dry-run:
    description: '试运行模式（不修改文件）'
    required: false
    # T209: 与 mode 默认 fix-and-pr 配套（dryRun 与 createPullRequest 互斥）
    default: 'false'
  max-alerts-per-repository:
    description: '每仓库最多处理的告警数'
    required: false
    default: '10'
  cleanup-branches:
    description: '（fix-and-pr 模式）结束后将已合并的 dependfix 分支列入报告待清理清单（不自动删除）'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub Token（需 security-events 权限；fix-and-pr 模式需 contents + pull-requests 写权限）'
    required: true
  dependabot-alerts-token:
    description: 'Dependabot alerts 专用 token（可选，最小权限 fine-grained PAT，仅需 Dependabot alerts: read；缺省回退 github-token。GITHUB_TOKEN 无法读取 Dependabot alerts API，仅给 GITHUB_TOKEN 会拉取失败）'
    required: false
    default: ''
  # ── M5 AI 引擎联调骨架 ──
  ai-api-token:
    description: 'AI API Token（M5 联调启用，通过 GitHub Secrets 传入）'
    required: false
    default: ''
  ai-api-base-url:
    description: 'AI API Base URL（M5 联调启用，支持多 AI 提供商）'
    required: false
    default: ''

outputs:
  report-artifact:
    description: '上传的报告 artifact 名称'
    value: ${{ steps.upload-report.outputs.artifact-name }}

runs:
  using: 'composite'
  steps:
    - name: Checkout target repository
      uses: actions/checkout@v7
      # 消费者仓库 checkout 到 $GITHUB_WORKSPACE（重复 checkout 幂等）。
      # dependfix CLI 的修复/提交/推送均作用于该目录；action 自身代码仍在 github.action_path。

    - name: Setup pnpm
      # pnpm 版本由消费者/本仓库 package.json 的 packageManager 字段声明（单一来源），
      # 不传 version 参数（v6 起同时指定且不一致会直接报错）
      uses: pnpm/action-setup@v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*

    - name: Install and build dependfix
      run: |
        cd "${{ github.action_path }}"
        pnpm install --frozen-lockfile
        pnpm --filter dependfix --filter @dependfix/core build
        # Smoke check：确认 CLI bin 可执行、外部依赖可解析（pnpm isolated 布局）
        node "${{ github.action_path }}/packages/cli/dist/bin.mjs" --help > /dev/null
      shell: bash

    - name: Run dependfix
      id: run-dependfix
      run: |
        REPOS="${{ inputs.repos }}"
        if [ -z "$REPOS" ]; then
          REPOS="${{ github.repository }}"
        fi
        # CLI 工作目录 = 消费者 checkout；bin 入口指向 action 自身构建产物
        cd "$GITHUB_WORKSPACE"
        node "${{ github.action_path }}/packages/cli/dist/bin.mjs" ${{ inputs.mode }} \
          --repo "$REPOS" \
          --severity-threshold ${{ inputs.severity-threshold }} \
          --max-alerts-per-repository ${{ inputs.max-alerts-per-repository }} \
          ${{ inputs.dry-run == 'true' && '--dry-run' || '' }} \
          ${{ inputs.cleanup-branches == 'true' && '--cleanup-branches' || '' }} \
          --verbose
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # Dependabot alerts 专用最小权限 token（经环境变量传递，避免出现在进程列表）
        AUTO_FIX_GITHUB_SECURITY_ALERTS_TOKEN: ${{ inputs.dependabot-alerts-token }}
        # M5: AI engine — passed to CLI when available
        AI_API_TOKEN: ${{ inputs.ai-api-token }}
        AI_API_BASE_URL: ${{ inputs.ai-api-base-url }}

    - name: Upload report artifact
      id: upload-report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dependfix-report-${{ github.run_id }}
        # 注意：with.path 是表达式上下文，必须用 ${{ }} 展开（裸环境变量不会展开）
        path: ${{ github.workspace }}/dependfix-reports/
        retention-days: 30

    - name: Write workflow summary
      if: always()
      run: |
        FOUND=0
        for f in "$GITHUB_WORKSPACE"/dependfix-reports/dependfix-report-*.md; do
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            FOUND=1
          fi
        done
        if [ "$FOUND" -eq 0 ]; then
          echo "⚠️ No report generated." >> "$GITHUB_STEP_SUMMARY"
        fi
      shell: bash
