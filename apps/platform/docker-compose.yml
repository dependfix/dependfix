# dependfix 平台部署编排（SQLite 数据卷持久化 + Redis 扫描队列）
#
# 默认拉取已发布镜像，不在本地构建（避免每次部署重跑 pnpm install + nuxt build）：
#   docker compose pull && docker compose up -d
# 仅在需要本地打包时使用构建覆盖文件（开发 / 自定义改动）：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# 镜像可换 registry：DEPENDFIX_IMAGE=ghcr.io/dependfix/dependfix:latest 或阿里云 ACR 地址。
services:
  # Redis（BullMQ 扫描队列存储；BullMQ 6 要求 Redis >= 5.0，redis:7-alpine 满足）
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - dependfix-redis:/data
    # 仅平台服务内部访问，不映射宿主机端口

  platform:
    # 默认已发布镜像（Docker Hub）；本地构建见 docker-compose.build.yml 覆盖文件
    image: ${DEPENDFIX_IMAGE:-caomeiyouren/dependfix:latest}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      # 运行身份（控制 /app/data 数据卷与 $HOME 的宿主侧所有权）：
      # 默认 100:101 = 镜像内 dependfix 用户（uid 100 / gid 101）；NAS / 多用户场景设为宿主用户 uid:gid。
      # PUID/PGID 解析为 0 时入口 fail-closed 拒绝启动（保持非 root 执行基线）。
      # 入口仅在 root 启动时能修复卷所有权并降权；若改用 user: 字段需宿主预先授权卷与 $HOME。
      PUID: ${PUID:-100}
      PGID: ${PGID:-101}
      # Nuxt runtimeConfig 运行时覆盖只认 NUXT_ 前缀（AUTH_SECRET 在构建期已烘焙，运行时无效）
      NUXT_AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-random-secret}
      DATABASE_PATH: /app/data/dependfix.sqlite
      # 首次启动自动执行 pending migration（镜像内已默认 true，此处显式声明并支持环境变量覆盖）。
      # 全新库由基线迁移创建全部基础表，存量库仅补 pending（已记录迁移不重跑）。
      # 如需完全手动控制，设 DATABASE_MIGRATIONS_RUN=false 并改用 docker/init-db.sh 初始化。
      DATABASE_MIGRATIONS_RUN: ${DATABASE_MIGRATIONS_RUN:-true}
      NUXT_ENCRYPTION_KEY: ${NUXT_ENCRYPTION_KEY:-}
      # 关闭注册（保留登录）：公开部署时设 REGISTRATION_DISABLED=true。
      # 注意：首次部署需保持 false 注册首个管理员后再关闭，否则平台无管理员。
      NUXT_REGISTRATION_DISABLED: ${REGISTRATION_DISABLED:-false}
      NUXT_PUBLIC_BETTER_AUTH_URL: ${NUXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:3000}
      # 扫描任务队列（渐进式降级）：Redis 可达且版本 >= 5.0 时异步队列，否则自动降级同步。
      # 运行时覆盖需 NUXT_ 前缀（构建产物烘焙默认值）
      NUXT_REDIS_URL: redis://redis:6379
      NUXT_QUEUE_ENABLED: ${QUEUE_ENABLED:-auto}
      NUXT_QUEUE_JOB_RETRIES: ${QUEUE_JOB_RETRIES:-}
      NUXT_QUEUE_BACKOFF_MS: ${QUEUE_BACKOFF_MS:-}
      # 单容器直接部署形态：Nuxt 进程内消费队列（SQLite 单写者安全）。
      # 独立 worker 进程形态（多容器）需等 PostgreSQL 迁移（SQLite 多进程写不兼容）后启用
      NUXT_IN_PROCESS_WORKER: ${IN_PROCESS_WORKER:-true}
    depends_on:
      - redis
    volumes:
      - dependfix-data:/app/data
    restart: unless-stopped

  # 独立 worker 进程（预留，PostgreSQL 生产迁移后启用）：
  # SQLite 下多容器共享 DB 存在写锁冲突，当前阶段使用单容器 in-process worker 形态。
  # worker:
  #   image: ${DEPENDFIX_IMAGE:-caomeiyouren/dependfix:latest}
  #   environment:
  #     PUID: ${PUID:-100}
  #     PGID: ${PGID:-101}
  #     NUXT_REDIS_URL: redis://redis:6379
  #     NUXT_IN_PROCESS_WORKER: "true"
  #     DATABASE_PATH: /app/data/dependfix.sqlite
  #     NUXT_ENCRYPTION_KEY: ${NUXT_ENCRYPTION_KEY:-}
  #   depends_on:
  #     - redis
  #     - platform
  #   volumes:
  #     - dependfix-data:/app/data
  #   restart: unless-stopped

volumes:
  dependfix-data:
  dependfix-redis:
