  # （todo.md §M18 范围），库升级可能改变 JWT signing / installation token LRU TTL / rate limit 行为，
  # dependfix 集成层依赖该库契约稳定；M18.4 audit round 2 Reject 实测库集成 bug 后需锁定版本防回归。
  # 升级 @octokit/auth-app 前必须重跑 M18.4 e2e（packages/engine/src/auth/auth-flow.test.ts 13 case）
  # + 评估 breaking change（GitHub App 安装 token / JWT 签名 / rate limit 处理）。
  "@octokit/auth-app": 8.3.0
