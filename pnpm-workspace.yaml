packages:
  - packages/*
  - apps/*
  - docs
minimumReleaseAge: 60
confirmModulesPurge: false
allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
  vue-demi: true
overrides:
  compare-func: ^2.0.0
  katex: ^0.16.21
  esbuild: ^0.25.0
  "@octokit/plugin-paginate-rest": ^11.4.1
  "@octokit/request": ^9.2.1
  "@octokit/request-error": ^5.1.1
  tmp: ^0.2.4
  glob: ^14.0.3
  flatted: 3.4.2
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  fast-uri@3: ^3.1.9
  ip-address: ^10.7.4
  serialize-javascript: ^7.1.3
  js-yaml@4: ^4.3.2
  vitepress>vite: ^6.4.4
  launch-editor: ^2.14.2
  js-yaml@3: ^3.15.1
  "@octokit/auth-app": 8.3.0
  moment: ^2.31.0
  qs: ^6.16.1
  node-forge: ^1.4.2
  svgo: ^4.1.0
  "@vitest/mocker": ^4.1.12
  # 安全补丁（GHSA-4m76-xfj5-7975 / GHSA-h7mg-cq63-vhpq / GHSA-46wx-v44x-9hh2 /
  # GHSA-4h7h-rv7c-7m2v / GHSA-jpvv-r467-5p4w 等）：advisory 声明补丁线
  # hono >=4.13.16、@hono/node-server >=2.1.6；消费者为 @dependfix/mcp 的 MCP SDK 传递依赖，
  # 跨 minor（4.14.x / 2.2.x）需按 development.md §5.1.56 重新评估后再改此处。
  hono: ^4.13.16
  "@hono/node-server": ^2.1.6
  vitest: ^4.1.12
  undici: ^8.12.2
  body-parser: ^2.4.0
  handlebars: ^4.7.10
  devalue: ^5.9.3
  # 安全补丁（GHSA-83rm-6c8r-g728 / GHSA-f86p-h4j2-7qgj / GHSA-9wx9-5pv9-3349）：
  # overrides 会替换该包的解析范围，故按 advisory 声明的最小修复版本线钉定；
  # 同范围内的新补丁由 pnpm update 正常跟进，跨 minor（12.x / 1.7.x）需评估后改此处。
  # seroval 用 ~ 收在同一 minor，避免顺带引入未评估的 1.7.x。
  "vue-i18n": ^11.4.14
  "@intlify/core": ^11.4.14
  "@intlify/core-base": ^11.4.14
  "@intlify/shared": ^11.4.14
  "@intlify/message-compiler": ^11.4.14
  seroval: ~1.6.11

# 依赖审计豁免：advisory 声明的 patched 版本尚未发布，overrides / pnpm update 无法修复。
# 机制与复核条件见 docs/standards/security.md §5.7；修复版本发布后必须移除对应条目。
audit:
  ignore:
    # minimatch < 11.0.1（glob 模式拒绝服务）；修复线只有 11.x，而消费者仍钉旧大版本：
    # - @nuxtjs/i18n > @intlify/unplugin-vue-i18n > eslint 链（minimatch 3.1.5）
    # - nuxt > @nuxt/nitro-server > nitropack > archiver > readdir-glob（minimatch 5.1.9）
    # - @typescript-eslint/typescript-estree（minimatch 10.2.4）
    # 注：glob 已跨大版本覆盖到 14.0.3 —— 14 仍导出 glob / globSync / hasMagic，且仅用于构建期（@vercel/nft / archiver-utils），
    # 已由 build / lint-md / e2e / 视觉验证；minimatch 的消费者（eslint / readdir-glob / typescript-estree）无此兼容性，故保留豁免。
    # 跨大版本覆盖会破坏 v3/v5/v10 API；仅构建期工具链，不进入请求处理路径。
    # 复核：消费者上游改用 minimatch >=11（或 eslint / archiver 放弃旧 API）后移除。
    - GHSA-g3hv-75wg-m249
