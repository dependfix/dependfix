  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  # unrs-resolver��pnpm 11 ��ȫ����Ҫ��Ĺ����ű���������Ŀ���� eslint-config-cmyr ���������룩��
  # ��ǰ��δ��ֵ��ռλ�ı����� pnpm install �� ERR_PNPM_IGNORED_BUILDS
  unrs-resolver: true
overrides:
  compare-func: ^2.0.0
  katex: ^0.16.21
  esbuild: ^0.25.0
  "@octokit/plugin-paginate-rest": ^11.4.1
  "@octokit/request": ^9.2.1
  "@octokit/request-error": ^5.1.1
  tmp: ^0.2.4
  glob: ^11.1.0
  flatted: 3.4.2
  brace-expansion@1: ^1.1.16
  brace-expansion@5: ^5.0.7
  fast-uri@3: ^3.1.5
  js-yaml@4: ^4.3.0
  vite@5: ^5.4.21
  js-yaml@3: ^3.15.1
